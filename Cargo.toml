[package]
name = "cosca"
version = "0.1.0"
edition = "2021"
authors = ["Anna Zhukova"]
description = "Unified cross-platform subprocess management: spawning, stdio, process trees, stable identity, and elevation."
license = "Apache-2.0"
repository = "https://github.com/bindreams/cosca"
readme = "README.md"
keywords = ["subprocess", "process", "spawn", "elevation", "cross-platform"]
categories = ["os", "development-tools", "asynchronous"]
exclude = ["/testbin", "/tests", "/.github", "/.claude", "/prek.toml"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[features]
pty = []
tokio = ["dep:tokio"]
# Serialize a ProcessIdRecord so an identity survives a supervisor restart.
serde = ["dep:serde"]

[dependencies]
thiserror = "2"
shared_child = { version = "1", features = ["timeout"] }
log = "0.4"
# Zeroize the password held for Auth::Stdin so it never lingers in freed memory.
zeroize = "1"
# Only ProcessIdRecord is (de)serializable; `derive` is for its field attributes.
serde = { version = "1", optional = true, features = ["derive"] }
# `macros` is required by the library, not only tests: `communicate` uses `tokio::try_join!`,
# which is gated behind tokio's `macros` feature. `net` is solely for `AsyncFd` (the
# reactor-native death-watch); `time` solely for the grace bound on it. `sync` backs the
# per-instance wait observer (a `#[cfg(test)]` oneshot seam) the raw async backend is tested with.
tokio = { version = "1", optional = true, features = ["process", "rt", "io-util", "macros", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
# A concrete format to pin the persisted wire form against.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Unpredictable merge-target pipe names (std parity: std randomizes its anon-pipe names).
# `std` for the `io::Error` conversion.
getrandom = { version = "0.4", features = ["std"] }
# `get_osfhandle`/`isatty`: the testbin maps CRT fds to OS handles and classifies devices.
libc = "0.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process", "event", "term", "fs"] }
command-fds = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "event"] }

[[bin]]
name = "cosca_testbin"
path = "testbin/main.rs"
test = false
doc = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
