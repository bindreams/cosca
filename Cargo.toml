[package]
name = "cosca"
version = "0.4.0"
edition = "2021"
authors = ["Anna Zhukova"]
description = "Unified cross-platform subprocess management: spawning, stdio, process trees, stable identity, and elevation."
license = "Apache-2.0"
repository = "https://github.com/bindreams/cosca"
readme = "README.md"
keywords = ["subprocess", "process", "spawn", "elevation", "cross-platform"]
categories = ["os", "development-tools", "asynchronous"]
exclude = ["/build.rs", "/testbin", "/tests", "/.github", "/.claude", "/.config", "/prek.toml", "/clippy.toml"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[features]
pty = []
tokio = ["dep:tokio", "dep:crossbeam-channel"]
# Serialize a ProcessIdRecord so an identity survives a supervisor restart.
serde = ["dep:serde"]

[dependencies]
thiserror = "2"
shared_child = { version = "1", features = ["timeout"] }
log = "0.4"
# Zeroize the password held for Auth::Stdin so it never lingers in freed memory.
zeroize = "1"
# Only ProcessIdRecord is (de)serializable; `derive` is for its field attributes.
serde = { version = "1", optional = true, features = ["derive"] }
# `macros` is required by the library, not only tests: `communicate` uses `tokio::try_join!`,
# which is gated behind tokio's `macros` feature. `net` is solely for `AsyncFd` (the
# reactor-native death-watch); `time` solely for the grace bound on it. `sync` backs the
# per-instance wait observer (a `#[cfg(test)]` oneshot seam) the raw async backend is tested with.
tokio = { version = "1", optional = true, features = ["process", "rt", "io-util", "macros", "net", "sync", "time"] }
# The reaper pool's job queue. `std::sync::mpsc::Receiver` is neither `Sync` nor `Clone`, so the
# std route is a hand-rolled queue behind a mutex whose most likely defect — holding the guard
# across the job — collapses the pool's bulkhead into a serial reaper. Each worker owns a cloned
# MPMC receiver instead, so no lock exists to get wrong.
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
# A concrete format to pin the persisted wire form against.
serde_json = "1"
# `test-util`: `start_paused` virtual clock for the deadline tests. Dev-only.
tokio = { version = "1", features = ["test-util"] }
# `requires = [...]` declares a runtime precondition; an unmet one skips the test.
skuld = "0.3.1"

[target.'cfg(windows)'.dev-dependencies]
# Every feature below except `Wdk_System_SystemServices` and `Win32_Security_Authorization` is
# already enabled on the main `windows` dependency further down this file — integration tests
# reach that dependency directly, they are not walled off from it. Those two are the genuine
# additions:
# - `Wdk_System_SystemServices`: only `windows_path_resolution`'s `provenance.rs` needs it, for
#   `RtlGetVersion` (stamps each measurement with its OS build).
# - `Win32_Security_Authorization`: only `resolve_windows_tests.rs` needs it, for
#   `SetNamedSecurityInfoW`, `GetNamedSecurityInfoW`, `SetEntriesInAclW`, `EXPLICIT_ACCESS_W` and
#   `TRUSTEE_W`, to build a real deny ACE on a real Windows host rather than simulate one. (Its
#   thread-impersonation guard needs no feature beyond `Win32_Security`/`Win32_System_Threading`,
#   both already enabled: `DuplicateTokenEx` lives in the former, `SetThreadToken` in the latter.)
#
# Declaring both here, in dev-dependencies, keeps them out of the published crate's own
# dependency footprint for downstream consumers who only pull in `[dependencies]`. The `windows_*`
# probes (not specific to either feature above) call GetFullPathNameW, GetFileInformationByHandleEx,
# ShellExecuteExW, the token APIs, the CreateProcess* family, SetHandleInformation, RtlGetVersion,
# RegGetValueW and CompareStringOrdinal directly (RtlGetVersion and RegGetValueW stamp each
# measurement with its OS build; CompareStringOrdinal orders an environment block's keys the same
# case-insensitive way CreateProcess* itself does) to MEASURE the platform rather than to use
# cosca; `windows_shell_execute` calls ShellExecuteExW from an STA and writes one volatile App
# Paths key in HKLM and one in HKCU (see its module doc).
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
# Unpredictable merge-target pipe names (std parity: std randomizes its anon-pipe names).
# `std` for the `io::Error` conversion.
getrandom = { version = "0.4", features = ["std"] }
# `get_osfhandle`/`isatty`: the testbin maps CRT fds to OS handles and classifies devices.
libc = "0.2"
# `Win32_Networking_WinSock` is compile-time bindings only, for the testbin's `WSAEventSelect`-based
# death-watched accept (`tests/common/accept.rs`, included by `#[path]`): a `[[bin]]` target cannot
# see the dev-dependencies' feature.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process", "event", "term", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Broadcasts a cgroup leaf's drain from its pump to every wait, sync and async alike.
event-listener = "5"
# The random part of a cgroup leaf's name.
getrandom = "0.4"
rustix = { version = "1", features = ["process", "event", "net", "fs", "thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["mount"] }

[[test]]
name = "process"
path = "tests/process.rs"
harness = false

[[bin]]
name = "cosca_testbin"
path = "testbin/main.rs"
test = false
doc = false

[[bin]]
name = "cosca_testbin_gui"
path = "testbin/gui.rs"
test = false
doc = false

[[bin]]
name = "cosca_testbin_image"
path = "testbin/image_report.rs"
test = false
doc = false

# Long-path aware, by the manifest `build.rs` embeds in this binary alone.
[[bin]]
name = "cosca_testbin_cwd"
path = "testbin/cwd.rs"
test = false
doc = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# `all` is a group; priority -1 lets the individual entries below override it.
all = { level = "warn", priority = -1 }
# Every `#[allow]` needs a `reason`, in all targets including tests. `disallowed-methods` exemptions
# are `#[expect]`, so a stale one fails too.
allow_attributes_without_reason = "deny"
