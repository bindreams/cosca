# The Linux guest for cosca's sandbox lanes (`devvm/README.md`): Ubuntu 24.04, the packages the elevation and
# cgroup tests need, the toolchain CI uses, and the git-tracked tree at ~/cosca. The tree comes last, so an edit
# to a tracked file rebuilds nothing above it.
from: ubuntu-24.04
resources:
  cpus: 4
  memory: 8GiB
steps:
  # A C linker, and what the ELEVATION group elevates through: polkit (`pkexec`) and `doas`.
  - elevated: true
    shell: bash
    run: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get -o DPkg::Lock::Timeout=-1 update -qq
      apt-get -o DPkg::Lock::Timeout=-1 install -qq -y --no-install-recommends build-essential polkitd pkexec opendoas
  # `.github/scripts/unattended-gui-elevation.py` and `elevation-lane-sudoers.sh` weaken a machine only where this
  # file exists. It is written here, never by a script that could be run on a host.
  - elevated: true
    run: echo 'devvm guest' > /etc/cosca-devvm-guest
  # The user's sessions get umask 022, as a CI runner's do. Under Ubuntu's 002 the tests' temp directories are
  # group-writable, which the shim's private-directory check refuses.
  - elevated: true
    run: sed -i 's/^USERGROUPS_ENAB yes/USERGROUPS_ENAB no/' /etc/login.defs
  # What the root lanes' container has (`.github/actions/root-lane`): the checkout at /repo, the archive in
  # /artifacts, the JUnit directory /junit-out, and `cargo-nextest` on root's PATH. The root lanes' uid 65534 must
  # reach the tree.
  - elevated: true
    shell: bash
    run: |
      set -euo pipefail
      chmod a+x /home/user
      ln -s /home/user/cosca /repo
      ln -s /home/user/.cargo/bin/cargo-nextest /usr/local/bin/cargo-nextest
      install -d -m 0755 /artifacts
      install -d -m 1777 /junit-out
  # The version of `.github/ci-toolchain`; Renovate moves both (`.github/renovate.json`).
  - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
  # cargo-nextest's release tarball, checked before it is unpacked. The tag and digest share a line so Renovate
  # moves them together.
  - shell: bash
    run: |
      set -euo pipefail
      NEXTEST_TAG_X86_64="cargo-nextest-0.9.151" NEXTEST_SHA256_X86_64="1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4"
      tarball="$(mktemp)"
      curl --proto '=https' --tlsv1.2 -sSf -L -o "$tarball" \
        "https://github.com/nextest-rs/nextest/releases/download/$NEXTEST_TAG_X86_64/$NEXTEST_TAG_X86_64-x86_64-unknown-linux-gnu.tar.gz"
      echo "$NEXTEST_SHA256_X86_64  $tarball" | sha256sum -c -
      tar -xzf "$tarball" -C "$HOME/.cargo/bin" cargo-nextest
      "$HOME/.cargo/bin/cargo" nextest --version
  - copy: { from: git-tracked, to: ~/cosca, read-only: true }
