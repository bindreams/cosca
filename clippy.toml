# Every function in this crate's dependency graph that can change the OS process's *current*
# working directory — as opposed to a `Command`'s spawn-time cwd, which is fine; see
# `src/child/spawn.rs`'s and `testbin/main.rs`'s `#[expect(clippy::disallowed_methods)]` call
# sites for why those two are the only legitimate callers. The process cwd is global state shared
# by every concurrently running `#[test]` in the same test binary, so nothing in `src/`, `tests/`
# or `testbin/` may call one of these outside a deliberately reviewed, `#[expect]`-annotated site.
#
# `allow-invalid = true` entries are not reachable under every target/feature combination this
# crate is linted with (checked via `cargo clippy`/`cargo hack clippy`/`cargo xwin clippy` across
# aarch64-apple-darwin, x86_64-unknown-linux-gnu and x86_64-pc-windows-msvc, `--feature-powerset`):
# clippy silently skips a path whose crate isn't linked at all for the target being checked, but
# warns "does not refer to a reachable function" for a path whose crate IS linked yet the specific
# item is absent for that target/feature combination — `allow-invalid` suppresses only that second
# case, once confirmed to be exactly that and not a typo.
disallowed-methods = [
    { path = "std::env::set_current_dir", reason = "mutates the whole process's cwd; see this file's header" },
    { path = "libc::chdir", reason = "raw chdir(2)/CRT _chdir wrapper; see this file's header" },
    { path = "libc::fchdir", reason = "raw fchdir(2) wrapper, unix-only; see this file's header", allow-invalid = true },
    { path = "nix::unistd::chdir", reason = "nix's chdir(2) wrapper; see this file's header" },
    { path = "nix::unistd::fchdir", reason = "nix's fchdir(2) wrapper; see this file's header" },
    { path = "rustix::process::chdir", reason = "rustix's chdir(2) wrapper; see this file's header", allow-invalid = true },
    { path = "rustix::process::fchdir", reason = "rustix's fchdir(2) wrapper; see this file's header", allow-invalid = true },
    { path = "rustix::fs::Dir::chdir", reason = "rustix's Dir-handle chdir, itself an fchdir(2) wrapper; see this file's header", allow-invalid = true },
    { path = "windows::Win32::System::Environment::SetCurrentDirectoryA", reason = "Win32 ANSI SetCurrentDirectory; see this file's header" },
    { path = "windows::Win32::System::Environment::SetCurrentDirectoryW", reason = "Win32 wide SetCurrentDirectory; see this file's header" },
    { path = "windows_sys::Win32::System::Environment::SetCurrentDirectoryA", reason = "windows-sys ANSI SetCurrentDirectory; not reachable with this crate's currently-enabled windows-sys features (kept for defense-in-depth against a future dependency change) — see this file's header", allow-invalid = true },
    { path = "windows_sys::Win32::System::Environment::SetCurrentDirectoryW", reason = "windows-sys wide SetCurrentDirectory; not reachable with this crate's currently-enabled windows-sys features (kept for defense-in-depth against a future dependency change) — see this file's header", allow-invalid = true },
]
