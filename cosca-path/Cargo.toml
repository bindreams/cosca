[package]
name = "cosca-path"
version = "0.6.0"
edition = "2021"
authors = ["Anna Zhukova"]
description = "Pure per-OS paths for cosca: faithful components, exact equality, no implicit normalisation."
license = "Apache-2.0"
repository = "https://github.com/bindreams/cosca"
keywords = ["path", "posix", "windows", "cross-platform"]
categories = ["filesystem", "os"]

[dependencies]
# Zero-copy `&OsStr` -> `&Path` casts without hand-written `unsafe`.
ref-cast = "1"

[dev-dependencies]
# The test harness for the `harness = false` lib.
skuld = "0.6.0"

[lib]
# The lib's unit tests run on skuld (`src/lib.rs` has the `main`).
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# `all` is a group; priority -1 lets the individual entries below override it.
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
