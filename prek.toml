# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# `.tmp/` is agent scratch — not source to be linted/reformatted, same rationale as
# `target/`. Both are gitignored; excluding them too guards against a stray force-add.
exclude = "^(target|\\.tmp)/"
default_install_hook_types = ["pre-commit", "pre-push"]
# A hook runs at commit unless it names its own stages (`cargo-clippy` runs at push).
default_stages = ["pre-commit"]

# Local hooks ==========================================================================================================

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt"
language = "system"
types = ["rust"]
pass_filenames = false

# Platform-dependent hooks check the host target: the Lint job SKIPs them; every Test lane runs `cargo-doc` after its
# tests, and the `matrix.lint` lanes run `cargo-clippy` last (ci.yaml). A new one goes in both places.
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
# Three passes (see the script): a pre-push hook, not a pre-commit one. `prek run` selects it only with
# `--hook-stage pre-push`.
entry = "bash .github/scripts/clippy.sh"
language = "system"
stages = ["pre-push"]
files = '\.rs$|(^|/)(Cargo\.(toml|lock)|clippy\.toml)$'
pass_filenames = false

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc"
entry = "bash .github/scripts/doc.sh"
language = "system"
files = '\.rs$|(^|/)Cargo\.(toml|lock)$'
pass_filenames = false

# Platform-independent hooks: the Lint job runs them. =====================================================================

[[repos.hooks]]
id = "musl-check"
name = "library builds for musl"
entry = "bash .github/scripts/musl-check.sh"
language = "system"
files = '\.rs$|(^|/)Cargo\.(toml|lock)$'
pass_filenames = false

# The two standalone tool crates, which the root workspace's cargo-fmt and cargo-clippy do not reach.
[[repos.hooks]]
id = "tools-fmt"
name = "tools fmt"
entry = "bash .github/scripts/tools.sh fmt"
language = "system"
files = '^(\.github/libtest-lint|scripts/skuld-rewrite)/.*(\.rs|Cargo\.(toml|lock))$'
pass_filenames = false

[[repos.hooks]]
id = "tools-clippy"
name = "tools clippy"
entry = "bash .github/scripts/tools.sh clippy"
language = "system"
files = '^(\.github/libtest-lint|scripts/skuld-rewrite)/.*(\.rs|Cargo\.(toml|lock)|clippy\.toml)$'
pass_filenames = false

[[repos.hooks]]
id = "libtest-lint"
name = "libtest lint"
# Every target runs on skuld, so a libtest `#[test]` never runs. See .github/libtest-lint/src/main.rs for what it
# covers.
entry = "cargo run --quiet --release --locked --manifest-path .github/libtest-lint/Cargo.toml"
language = "system"
# The lint's inputs: sources, manifests and itself.
files = '\.rs$|(^|/)Cargo\.toml$|^\.github/libtest-lint/'
pass_filenames = false

# External hooks =======================================================================================================
# Every external hook is pinned as `rev = "<40-hex commit SHA>" # frozen: <tag>`, with `repo` on the line
# before `rev` (comment lines may sit between). `prek autoupdate --freeze` writes this form. Renovate's
# prek manager (.github/renovate.json) tracks only this form, so a rev in any other shape goes untracked.


[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
hooks = [
  { id = "check-executables-have-shebangs" },
  # Rust inner attributes start with `#![...]`, which the shebang detector
  # mistakes for `#!/...`. Exclude .rs.
  { id = "check-shebang-scripts-are-executable", exclude_types = ["rust"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "e8b4e28241a9ae8296ba6e4a491b5da4eda73283" # frozen: 3.11.1
hooks = [
  # Rust gets `cargo fmt`; markdown gets prettier; both have stronger opinions
  # than .editorconfig and conflict on trailing whitespace, so exclude them.
  { id = "editorconfig-checker", exclude_types = ["rust", "markdown"] },
]

[[repos]]
# Prettier (rather than mdformat) so trailing-two-space line breaks are preserved.
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "331f33fa4dfbcbca7c3da3620c137fde0faab273" # frozen: v3.9.10
hooks = [
  { id = "prettier", types = ["markdown"] },
]
