# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# `.tmp/` is agent scratch — not source to be linted/reformatted, same rationale as
# `target/`. Both are gitignored; excluding them too guards against a stray force-add.
exclude = "^(target|\\.tmp)/"
default_install_hook_types = ["pre-commit", "commit-msg"]

# Local hooks ==========================================================================================================

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
# .github/scripts/clippy.sh is the single source of truth for this repo's
# clippy policy; CI's clippy-powerset composite action calls the same script
# with extra --target/--feature-powerset flags. Called with neither here, so
# this hook stays a fast, host-only check.
entry = "bash .github/scripts/clippy.sh"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "libtest-guard"
name = "libtest guard"
# No test in a `harness = false` target uses the built-in `#[test]`. Host only, debug, default features;
# CI's Test job runs it per target over the feature powerset in both profiles (and skips this hook).
entry = "uv run --script .github/scripts/libtest_guard.py"
language = "system"
# The guard's inputs: sources, manifests, its config and itself.
files = '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/libtest-guard/|^\.github/scripts/libtest_guard\.py$'
pass_filenames = false

# External hooks =======================================================================================================
# Every external hook is pinned as `rev = "<40-hex commit SHA>" # frozen: <tag>`, with `repo` on the line
# before `rev` (comment lines may sit between). `prek autoupdate --freeze` writes this form. Renovate's
# prek manager (.github/renovate.json) tracks only this form, so a rev in any other shape goes untracked.


[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
hooks = [
  { id = "check-executables-have-shebangs" },
  # Rust inner attributes start with `#![...]`, which the shebang detector
  # mistakes for `#!/...`. Exclude .rs.
  { id = "check-shebang-scripts-are-executable", exclude_types = ["rust"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "e8b4e28241a9ae8296ba6e4a491b5da4eda73283" # frozen: 3.11.1
hooks = [
  # Rust gets `cargo fmt`; markdown gets prettier; both have stronger opinions
  # than .editorconfig and conflict on trailing whitespace, so exclude them.
  { id = "editorconfig-checker", exclude_types = ["rust", "markdown"] },
]

[[repos]]
# Prettier (rather than mdformat) so trailing-two-space line breaks are preserved.
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "ef4a397f916211b4a39ccf9d3d9cbb6562157251" # frozen: v3.9.9
hooks = [
  { id = "prettier", types = ["markdown"] },
]
