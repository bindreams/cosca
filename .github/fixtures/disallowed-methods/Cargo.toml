[package]
name = "disallowed-methods-fixture"
version = "0.0.0"
edition = "2021"
publish = false
description = "Regression fixture proving the root clippy.toml's disallowed-methods bans still fire; not part of the cosca package."

[lib]
doctest = false

[dependencies]
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["pipe"] }
