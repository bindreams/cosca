name: Libtest guard, other architecture
description: >
  Runs the libtest guard (libtest_guard.py) for a target triple in both profiles over the feature
  powerset, then the guard's self-test. clippy.sh already runs the guard for a lane's own
  architecture; a test gated on `target_arch` is only seen when the guard compiles for that
  architecture. Needs cargo-hack, clippy and the target installed.
inputs:
  target:
    description: "Rust target triple to check"
    required: true
runs:
  using: composite
  steps:
    - name: Libtest guard
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: uv run --script .github/scripts/libtest_guard.py --feature-powerset --both-profiles --target "$TARGET"

    # `!cancelled()`: reported even when the step above failed.
    - name: Test the libtest guard
      if: ${{ !cancelled() }}
      shell: bash
      run: uv run --script .github/scripts/libtest_guard_tests.py
