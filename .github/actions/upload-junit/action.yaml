name: Upload the nextest JUnit files
description: >
  Uploads every JUnit file the job's nextest steps collected in `$RUNNER_TEMP/junit`
  (.github/scripts/run-nextest.py and run-nextest.ps1), as one artifact. A job that runs several lanes
  uploads the main lanes' directory once, then each later lane's own files under a name of their own.
inputs:
  name:
    description: >
      Artifact name: <job>-<os>-<arch>. The action appends -<run attempt>, so a re-run does not
      upload into a name the first attempt already used.
    required: true
  path:
    description: >
      What to upload (a multi-line list is fine): files or directories. Defaults to the whole
      `$RUNNER_TEMP/junit` directory.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Upload the JUnit files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.name }}-${{ github.run_attempt }}
        path: ${{ inputs.path || format('{0}/junit', runner.temp) }}
        if-no-files-found: error
