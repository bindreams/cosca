name: Set up Rust build environment
description: Installs the Rust toolchain pinned in .github/ci-toolchain, caches the cargo registry, and configures sccache.
inputs:
  components:
    description: "Extra rustup components (e.g. 'clippy, rustfmt')"
    required: false
    default: ""
  targets:
    description: "Rust target triple(s)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The checkout must precede this action. The pin file is CI-only: Cargo.toml's
    # rust-version is the MSRV, a different thing.
    - name: Read the toolchain pin
      id: pin
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < "${GITHUB_WORKSPACE:?}/.github/ci-toolchain")" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.pin.outputs.version }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-

    - name: Configure sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.18.0

    - name: Enable sccache for cargo
      shell: bash
      run: bash "${{ github.action_path }}/enable-sccache.sh"

    # The libtest guard (.github/scripts/libtest_guard.py) is a `uv` script.
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: 0.13.1

    - name: Log toolchain versions
      shell: bash
      run: |
        rustc --version
        cargo --version
