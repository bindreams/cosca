name: Set up Rust build environment
description: Installs stable Rust, caches the cargo registry, and configures sccache.
inputs:
  components:
    description: "Extra rustup components (e.g. 'clippy, rustfmt')"
    required: false
    default: ""
  targets:
    description: "Rust target triple(s)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-

    - name: Configure sccache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    - name: Enable sccache for cargo
      shell: bash
      run: bash "${{ github.action_path }}/enable-sccache.sh"

    - name: Log toolchain versions
      shell: bash
      run: |
        rustc --version
        cargo --version
