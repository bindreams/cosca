name: Feature-powerset clippy
description: >
  Installs cargo-hack and lints the full feature powerset with clippy, via
  .github/scripts/clippy.sh --feature-powerset. Used on the `lint` job (host,
  covering Linux's non-default features the ubuntu-only prek hook's
  no-features run never type-checks) and on the windows/amd64 and darwin/arm64
  test lanes, which reach `#[cfg(windows)]` and `cfg(target_os = "macos")`
  code the `lint` job's own ubuntu-only run never type-checks. Also catches
  feature-gated dead_code that --all-features alone would miss.
inputs:
  target:
    description: "Rust target triple to lint; empty lints the host target"
    required: false
    default: ""
runs:
  using: composite
  steps:
    # If this step fails, the Clippy step below is skipped by default step
    # sequencing (no explicit outcome check needed) — the caller's own `if:`
    # is what decides whether this whole action runs at all.
    - name: Install cargo-hack
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack@0.6

    - name: Clippy (feature powerset)
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        if [[ -n "$TARGET" ]]; then
          .github/scripts/clippy.sh --feature-powerset --target "$TARGET"
        else
          .github/scripts/clippy.sh --feature-powerset
        fi
