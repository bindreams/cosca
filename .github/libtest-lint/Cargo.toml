[package]
name = "libtest-lint"
version = "0.0.0"
edition = "2021"
publish = false
description = "Pre-commit lint: no libtest test attribute in a workspace whose targets run on skuld."

# Empty workspace: keeps cargo from adopting this crate into the root package.
[workspace]

[dependencies]
# `span-locations` gives tokens line and column outside a proc macro.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = "=1.0.151"
syn = { version = "=2.0.119", features = ["full", "visit"] }
toml = "=1.1.6"
