name: k6-red
on:
  pull_request:
permissions:
  contents: read
jobs:
  mut:
    name: ${{ matrix.mutant }}
    strategy:
      fail-fast: false
      matrix:
        mutant: [none, drop-extra, extra-first]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Mutate
        shell: bash
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          python .github/k6-mutate.py
          git diff --stat
      - name: Test
        shell: bash
        run: cargo nextest run --locked --target x86_64-pc-windows-msvc --test windows_elevation_routes --profile ci --no-fail-fast
