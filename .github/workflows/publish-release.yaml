name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

concurrency:
  # Keyed on the raw input. `normalize-version.sh` strips a leading `v`, so
  # `0.1.0` and `v0.1.0` form separate groups resolving to one tag. Both sibling
  # repos do this; accepted rather than deviating on one detail of a ported idiom.
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real preflight — version validation, the CI matrix, the dry-run publish —
    # happens in draft-release.yaml before a draft can exist. The draft's
    # existence is the evidence it passed, and the operator dispatching this has
    # already reviewed it, so preflight is not duplicated here.
    environment: Deploy
    permissions:
      # `write`, not `read`: the List releases API only returns drafts to a
      # caller with push access.
      contents: write
      # Lets the runner mint the OIDC JWT that crates.io exchanges for a
      # short-lived publish token. Both scopes must be listed: declaring any
      # `permissions:` block sets every unlisted scope to `none`.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          V="$(bash .github/scripts/normalize-version.sh "$INPUT_VERSION")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Verify draft release exists and resolve commit SHA
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! RELEASE_JSON=$(gh release view "$TAG" --json isDraft,targetCommitish); then
            echo "::error::gh release view failed for $TAG. Does the draft release exist?"
            exit 1
          fi

          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG is already published"
            exit 1
          fi

          TARGET=$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Draft release target '$TARGET' is not a 40-char commit SHA. Recreate the draft via the Draft Release workflow."
            exit 1
          fi
          echo "commit_sha=$TARGET" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.commit_sha }}

      - uses: ./.github/actions/setup-rust

      # `cosca-path` and `cosca` release in lockstep at one version. Each is picked
      # by name: `.packages[0]` is whichever member cargo lists first.
      - name: Re-verify manifest versions match the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          METADATA="$(cargo metadata --no-deps --locked --format-version 1)"
          for crate in cosca-path cosca; do
            MANIFEST="$(jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version' <<<"$METADATA")"
            if [ "$MANIFEST" != "$VERSION" ]; then
              echo "::error::Checked-out commit declares '${MANIFEST}' for $crate but this dispatch asked for $VERSION"
              exit 1
            fi
          done

      # Per crate, so a re-dispatch after a partial publish (one crate uploaded,
      # the next failed) publishes only what is missing. The same skip covers the
      # first `cosca-path` release, which the owner uploads by hand (see the
      # note on the publish step).
      - name: Check crates.io for existing versions
        id: crates_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # crates.io rejects requests without a User-Agent with HTTP 403.
          CRATES_UA: "cosca-release-pipeline (https://github.com/bindreams/cosca)"
        shell: bash
        run: |
          set -euo pipefail
          # Dependency first, as `cargo publish` orders them anyway.
          to_publish=()
          for crate in cosca-path cosca; do
            CODE=$(curl -sL -A "$CRATES_UA" -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")
            case "$CODE" in
              200) echo "$crate ${VERSION} already on crates.io; skipping it." ;;
              404) to_publish+=("$crate") ;;
              *)
                echo "::error::Unexpected HTTP $CODE from crates.io API for $crate"
                exit 1
                ;;
            esac
          done
          echo "to_publish=${to_publish[*]}" >> "$GITHUB_OUTPUT"

      # Nothing to authenticate for once every crate is already published.
      #
      # This action's post step can fail the job after publish already
      # succeeded; see the completion-marker note on the final step for how
      # to tell that apart from a real failure.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
        if: steps.crates_check.outputs.to_publish != ''

      # FIRST RELEASE OF A CRATE: crates.io trusted publishing cannot create a
      # crate, so the token above is refused for a crate that does not exist yet.
      # For `cosca-path`, the first release needs one token-based upload by the
      # owner, after the Draft Release run (whose dry run has verified the
      # package) and before the Publish Release dispatch:
      #
      #   1. Check out the draft's target commit; `cargo login` with a token that
      #      may create crates; `cargo publish --locked -p cosca-path`.
      #   2. On crates.io, add a trusted publisher to `cosca-path`: repository
      #      bindreams/cosca, workflow publish-release.yaml, environment Deploy.
      #   3. Dispatch Publish Release. The check above sees `cosca-path` at this
      #      version and publishes only `cosca`.
      #
      # Later releases need none of this: both crates publish from here.
      - name: Publish to crates.io
        if: steps.crates_check.outputs.to_publish != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TO_PUBLISH: ${{ steps.crates_check.outputs.to_publish }}
        shell: bash
        # One invocation: cargo orders the crates by dependency and waits for
        # each to appear in the index before uploading the next.
        run: |
          set -euo pipefail
          args=()
          # Unquoted on purpose: split the space-separated crate names.
          for crate in $TO_PUBLISH; do
            args+=(-p "$crate")
          done
          cargo publish --locked "${args[@]}"

      - name: Publish GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.release.outputs.commit_sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # One last check immediately before the action that creates the tag:
          # the draft itself creates no tag, and a re-dispatch that resumes
          # after a failed un-draft still has no tag (isDraft was still true
          # above), so this is safe on every reachable path. It turns the race
          # below into an early, explicit refusal instead of a silent
          # mis-binding caught only by the read-back.
          bash .github/scripts/assert-tag-absent.sh "$TAG"

          gh release edit "$TAG" --draft=false

          # Un-drafting is what creates the tag, so this is the first moment the
          # binding is observable. If a tag named $TAG appeared between the draft's
          # creation and now, GitHub attaches the release to THAT commit — leaving
          # crates.io holding $SHA while the release points elsewhere. Read back and
          # fail loudly; a visible inconsistency is recoverable by hand, an
          # undetected one is not.
          #
          # `targetCommitish` is NOT usable for this: it is the stored input
          # field from release creation, not the tag's resolved commit. GitHub
          # never recomputes it when a draft is published — per the REST docs
          # it is "unused if the Git tag already exists" — so it would just
          # echo back the original $SHA and the guard would never fire.
          # Resolve the tag itself instead.
          if ! PUBLISHED="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq '.sha')"; then
            echo "::error::Could not resolve tag $TAG after publishing."
            echo "::error::The crate was uploaded to crates.io and the release was published; both are irreversible."
            echo "::error::Verify by hand that $TAG points at $SHA. Do NOT delete the release or tag on the strength of this error alone."
            exit 1
          fi

          if [ "$PUBLISHED" != "$SHA" ]; then
            echo "::error::Release $TAG points at $PUBLISHED, not the published commit $SHA."
            echo "::error::Fix by hand: delete the release and its tag, then re-run Draft Release."
            exit 1
          fi

          # Read this before reacting to a red run. Everything irreversible is
          # done by this line, but the trusted-publishing action's post step
          # runs AFTER it and fails the job if revoking its token errors. So a
          # red run means one of two very different things:
          #
          #   * marker present in the job summary — the release is COMPLETE and
          #     verified. The only thing that failed is token revocation, and
          #     that token expires on its own 30 minutes after it was minted.
          #     Take no action.
          #   * marker absent — a real step failed. Follow the error it printed.
          printf 'Release published: https://github.com/%s/releases/tag/%s\n' \
            "$REPO" "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
