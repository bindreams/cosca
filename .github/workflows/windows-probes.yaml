# Windows path-resolution and ShellExecuteEx canaries.
#
# Runs the platform canaries in tests/windows_path_resolution.rs and the elevating ones in
# tests/windows_shell_execute.rs on real Windows runners; see those files for what is asserted and
# why.
#
# GitHub disables a scheduled workflow after 60 days without repository activity; re-enable it
# from the Actions tab.
#
# Run it by hand with:
#
#     gh workflow run windows-probes.yaml [-f filter=<test-name substring>] [-f run_canary=false] \
#         [-f elevating=true]
name: windows-probes

on:
  # Every change to code whose correctness depends on these facts.
  pull_request:
    paths:
      - "src/child/spawn.rs"
      - "src/child/spawn/batch_gate.rs"
      - "src/child/spawn/batch_gate/**"
      - "src/resolve.rs"
      - "src/child/spawn/windows_raw.rs"
      - "src/child/spawn/windows_raw/resolve.rs"
      - "src/tokio/spawn/windows_raw.rs"
      - "src/elevation/windows.rs"
      - "src/elevation/shell_file.rs"
      - "tests/windows_path_resolution.rs"
      - "tests/windows_path_resolution/**"
      - "tests/windows_shell_execute.rs"
      # The canary's payload is built from here.
      - "testbin/**"
      # Which `windows` crate features are enabled decides what the probes can call.
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/windows-probes.yaml"
  # `windows-latest` floats: a new Windows build can change the answer with no commit here.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      filter:
        description: "Test-name filter (blank runs every probe)"
        required: false
        default: ""
      run_canary:
        description: "Run tests/windows_path_resolution.rs"
        type: boolean
        required: false
        default: true
      elevating:
        description: "Run tests/windows_shell_execute.rs, which ELEVATES and writes one volatile App Paths key in HKLM and one in HKCU"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A concurrency group holds one pending run, and a newly queued run cancels the pending one
# whatever `cancel-in-progress` says. Only PR runs may supersede each other; a schedule or dispatch
# run gets a group of its own so none is ever dropped.
concurrency:
  group: windows-probes-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  path-resolution:
    name: Path canary (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      # `--no-capture`: the surveys report only through stdout, and every canary prints what it
      # measured before asserting on it.
      # Each canary that passes leaves a marker named after itself (`mark_canary_passed`).
      - name: Run path-resolution probes
        if: github.event_name != 'workflow_dispatch' || inputs.run_canary
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/canary-markers
        run: |
          mkdir "$COSCA_CANARY_MARKERS"
          args=(nextest run --locked --profile ci --target ${{ matrix.target }} --test windows_path_resolution --run-ignored only --no-capture)
          if [[ -n "${FILTER}" ]]; then
            args+=("${FILTER}")
          fi
          cargo "${args[@]}"
      # These elevate through ShellExecuteEx(runas), which a runner already elevated grants without
      # a prompt, and register one volatile App Paths key in HKLM and one in HKCU, deleting each
      # again; a volatile parent key they had to create can stay behind until the runner is gone.
      # They run on every schedule and pull-request run too, so a change to that code, or a new
      # Windows build, re-measures it. They measure an ELEVATED caller's launch, not the consent
      # route cosca takes from an unelevated one, so the elevated path's rules do not rest on them.
      # These tests share machine-wide state and must not run concurrently with each other; unlike
      # the old `cargo test ... --test-threads=1`, nothing here enforces that — it comes from the
      # `windows-shell-execute` test group capped at one thread in `.config/nextest.toml`.
      - name: Run elevating probes
        if: github.event_name != 'workflow_dispatch' || inputs.elevating
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/elevating-markers
        run: |
          mkdir "$COSCA_CANARY_MARKERS"
          args=(nextest run --locked --profile ci --target ${{ matrix.target }} --test windows_shell_execute --run-ignored only --no-capture)
          if [[ -n "${FILTER}" ]]; then
            args+=("${FILTER}")
          fi
          cargo "${args[@]}"
      # A filter matching no test, or only surveys, would otherwise pass having asserted nothing.
      # Runs after a failure too, so the log shows which canaries passed.
      - name: Require that a canary ran
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_canary)
        shell: bash
        env:
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/canary-markers
        run: |
          shopt -s nullglob
          passed=("$COSCA_CANARY_MARKERS"/*)
          if ((${#passed[@]} == 0)); then
            echo "::error::no canary ran: the run asserted nothing about the platform"
            exit 1
          fi
          printf 'canary passed: %s\n' "${passed[@]##*/}"
      - name: Require that an elevating probe ran
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.elevating)
        shell: bash
        env:
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/elevating-markers
        run: |
          shopt -s nullglob
          passed=("$COSCA_CANARY_MARKERS"/*)
          if ((${#passed[@]} == 0)); then
            echo "::error::no elevating probe ran: the run asserted nothing about ShellExecuteEx"
            exit 1
          fi
          printf 'elevating probe passed: %s\n' "${passed[@]##*/}"
