# Throwaway: measures reserved-name trailing-dot strings on older and newer Windows. Do not merge.
name: probe-772-reserved

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: OS build
        shell: pwsh
        run: (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String)
      - name: Probe
        run: uv run .github/probes/probe_772_reserved.py
