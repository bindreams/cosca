# The elevation shim on the oldest and a mid-range Linux kernel (plan F, F4-M).
#
# The shim uses only calls that exist by Linux 5.4 (`pidfd_open`, `clone3`/`CLONE_PIDFD`,
# `waitid(P_PIDFD)`, `SCM_CREDENTIALS`), and its owner check does not need pidfs (Linux 6.9) or
# `SO_PEERPIDFD` (6.5). The hosted runners' kernels are far newer, so this boots 5.6 (the project
# floor) and 6.1 LTS (below both) under virtme-ng on the runner's KVM, prints `uname -r`, and runs
# the shim's end-to-end tests there. The log is the measurement: every claim about old kernels in
# the plan's D2 is replaced by it.
#
# Run it by hand with: gh workflow run shim-old-kernels.yaml
name: shim-old-kernels

on:
  pull_request:
    paths:
      - "src/elevation/shim.rs"
      - "src/elevation/shim/**"
      - "testbin/shim_hooks.rs"
      - ".github/workflows/shim-old-kernels.yaml"
  workflow_dispatch:

concurrency:
  group: shim-old-kernels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.146"
  VIRTME_NG_VERSION: "1.30"

jobs:
  shim:
    name: Shim on Linux ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: ["v5.6", "v6.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Build tests
        run: cargo nextest run --locked --lib --no-run

      # The runner image has /dev/kvm, but only for the kvm group.
      - name: Allow KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -w /dev/kvm

      - name: Install virtme-ng
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 busybox-static libvirt-dev dwarves
          pipx install "virtme-ng==${VIRTME_NG_VERSION}"
          # virtme-ng imports pkg_resources, which the runner's Python no longer ships.
          pipx inject --force virtme-ng "setuptools==75.8.0"

      # The guest sees this checkout and the toolchain through the host's file system. The kernel is the
      # pre-built mainline one for the tag; the script prints `uname -r` first and checks it names the tag.
      - name: Run the shim's tests on the old kernel
        timeout-minutes: 15
        shell: bash
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          set -euxo pipefail
          vng --run "$KERNEL" --verbose --show-boot-console --user root --cpus 2 --memory 2G \
            --exec "env PATH='$PATH' HOME='$HOME' CARGO_HOME='${CARGO_HOME:-$HOME/.cargo}' RUSTUP_HOME='${RUSTUP_HOME:-$HOME/.rustup}' bash '$PWD/.github/scripts/shim-old-kernel-guest.sh' '$KERNEL'"
