name: loop
on:
  pull_request:
env:
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Build
        run: cargo nextest run --lib --no-run --locked
      - name: Loop
        run: |
          set +e
          sw_vers
          sysctl -n hw.ncpu
          (yes >/dev/null &) ; (yes >/dev/null &) ; (yes >/dev/null &)
          fails=0
          for i in $(seq 1 200); do
            cargo nextest run --lib --locked -E 'test(/tracer_tests::/)' >run.log 2>&1 || { fails=$((fails+1)); echo "--- run $i FAILED"; grep -E "DIAG|panicked|TIMEOUT|left:|right:|assertion|FAIL " run.log | head -12; }
          done
          echo "RESULT ${{ matrix.runner }}: $fails failing iterations of 200"
          pkill yes
