name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let main / dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # setup-rust so the cargo-fmt / cargo-clippy prek hooks (language = "system")
      # find a toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # prek.toml is the single source of truth for lint — the same checks run
      # locally as git hooks. prek-action runs `prek run --all-files`.
      - uses: j178/prek-action@v2

      - name: Test release helper scripts
        shell: bash
        run: bash .github/scripts/release-script-tests.sh

  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: darwin
            arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          # clippy only on windows/amd64 (see the Clippy step below for why one
          # Windows arch stands in for both).
          components: ${{ matrix.os == 'windows' && matrix.arch == 'amd64' && 'clippy' || '' }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      # `pty` is an additive feature flag; exercise the feature-gated code paths.
      - name: Run tests (pty feature)
        run: cargo test --locked --features pty --target ${{ matrix.target }}

      - name: Run tests (tokio feature)
        run: cargo test --locked --features tokio --target ${{ matrix.target }}

      # `serde` is an additive feature flag; exercise the persisted-identity wire format.
      - name: Run tests (serde feature)
        run: cargo test --locked --features serde --target ${{ matrix.target }}

      - name: Check rustdoc
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked --target "$TARGET"

      - name: Assert the package excludes test-only paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Write outside the workspace. A listing file created in the package
          # root becomes an uncommitted, non-excluded file that cargo sees as a
          # dirty worktree — the guard would abort before ever running.
          LIST="${RUNNER_TEMP}/pkg-list.txt"
          cargo package --list --locked --target "$TARGET" > "$LIST"

          set +e
          grep -qE '^(testbin/|tests/|\.github/|\.claude/|prek\.toml$)' "$LIST"
          grep_status=$?
          set -e

          case "$grep_status" in
            0)
              echo "::error::Excluded paths leaked into the package:"
              grep -E '^(testbin/|tests/|\.github/|\.claude/|prek\.toml$)' "$LIST"
              exit 1
              ;;
            1) echo "no excluded paths in the package" ;;
            *)
              echo "::error::grep errored (exit $grep_status); exclusion unverified"
              exit 1
              ;;
          esac

      # `#[cfg(windows)]` code (including feature-gated code, e.g. tokio's raw
      # backend) is otherwise never linted: the `lint` job only runs on
      # ubuntu-latest, so clippy never type-checks it against a Windows target.
      #
      # --feature-powerset (via cargo-hack), not --all-features: a default-
      # features-only build has real dead_code gaps --all-features alone never
      # catches — measured: src/wait/windows.rs's block_until_exit_or_cancel
      # carries `#[cfg_attr(not(feature = "tokio"), allow(dead_code))]`; delete
      # it and clippy stays clean under --all-features but exits 101 under
      # --no-default-features. This crate declares no `default` feature, so
      # cargo-hack's powerset of {pty, serde, tokio} (8 combinations) already
      # covers the no-feature case.
      #
      # Placed after the test steps above, not right after Build: step order
      # (not the `!cancelled()` gate below) is what keeps the earlier test
      # steps' own results green if this step later fails — each step's
      # conclusion is fixed when it finishes, and GitHub Actions runs steps
      # in the order they're listed. `!cancelled()` instead lets this step
      # still run and report its own result even if an earlier step in the
      # job already failed; the job as a whole still fails regardless,
      # because that earlier step keeps its own failing conclusion.
      #
      # Adds about 36s to the windows/amd64 leg (2s install + 34s clippy),
      # measured against main (job 106991533545), which has no Windows
      # clippy step at all.
      #
      # Runs on amd64 only, not arm64: nothing in this crate's Windows code is
      # `cfg(target_arch = ...)`-gated (checked: no such attribute exists in the
      # tree), so the two arches type-check and lint identically — confirmed by
      # running this exact command against aarch64-pc-windows-msvc locally via
      # `cargo xwin` and getting the same (clean) result. Linting both would
      # double Windows runner-minutes for no additional coverage.
      - name: Install cargo-hack
        id: install-cargo-hack
        if: ${{ !cancelled() && matrix.os == 'windows' && matrix.arch == 'amd64' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6

      - name: Clippy (feature powerset)
        if: ${{ !cancelled() && steps.install-cargo-hack.outcome == 'success' && matrix.os == 'windows' && matrix.arch == 'amd64' }}
        run: cargo hack clippy --locked --target ${{ matrix.target }} --all-targets --feature-powerset -- -D warnings

      # Release lane (debug_assertions off): exercises the calm-release arm of the
      # should_panic oracles in the macOS-gated kinfo_tests.rs.
      - name: Unit tests (release — debug_assertions off)
        if: matrix.os == 'darwin'
        run: cargo test --locked --release --lib --target ${{ matrix.target }}

      # Live cgroup v2 containment tests are gated behind COSCA_TEST_CGROUP
      # (a no-op without it). They need a cgroup the supervisor may create child
      # cgroups under. We make a fresh leaf directly under the unified root cgroup:
      # its `cgroup.subtree_control` is empty, so the v2 "no internal processes"
      # rule does not apply and a cgroup may hold BOTH the test process and a child
      # leaf. We move our shell into it and run only the cgroup-named tests there
      # (as root, single-threaded) — both the `spawn_io` integration binary and the
      # `--lib` unit-test binary (which carries the white-box CgroupLeaf::wait_drained
      # coverage in src/containment/cgroup_tests.rs). With the marker set the tests
      # assert CgroupV2/build a real leaf and FAIL LOUDLY if it is unusable — never a
      # silent skip.
      - name: Run cgroup v2 containment tests (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          cargo test --locked --features pty --target ${{ matrix.target }} --no-run
          JSON=$(cargo test --locked --features pty --target ${{ matrix.target }} --no-run --message-format=json)
          BIN=$(echo "$JSON" \
            | jq -r 'select(.profile.test == true and .target.name == "spawn_io") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -n "$BIN"
          echo "cgroup test binary: $BIN"
          LIB_BIN=$(echo "$JSON" \
            | jq -r 'select(.profile.test == true and .target.name == "cosca" and (.target.kind | contains(["lib"]))) | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -n "$LIB_BIN"
          echo "cgroup lib unit test binary: $LIB_BIN"
          sudo bash -euxc '
            CG=/sys/fs/cgroup/cosca-ci
            mkdir -p "$CG"
            echo $$ > "$CG/cgroup.procs"
            export COSCA_TEST_CGROUP=1
            "$0" cgroup --nocapture --test-threads=1
            exec "$1" cgroup --nocapture --test-threads=1
          ' "$BIN" "$LIB_BIN"

      # Live setuid-root process-group teardown test (issue #61) is `#[ignore]`d by default
      # (see tests/group_teardown_setuid.rs's module docs) — an ordinary `cargo test`
      # anywhere, including the steps above, reports it as `ignored`, never a vacuous `ok`.
      # This is the one step that opts in, via `-- --ignored`, after provisioning a COPY of
      # cosca_testbin that is genuinely setuid-root (owned by root, mode u+s) so the spawned
      # helper process can call setuid(0) itself and become truly unsignalable by this job's
      # ordinary unprivileged user — proving #61's fix against a REAL mixed process group
      # (one signalable member, one genuinely not), not a synthetic one. Only preparing the
      # helper copy needs root; the test itself runs as the normal unprivileged runner user,
      # no sudo. Once opted in, an unset/unusable helper FAILS LOUDLY (wrong owner/mode, or a
      # nosuid mount) — never a silent skip.
      - name: Set up setuid-root helper (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          BIN=$(cargo build --locked --target ${{ matrix.target }} --bin cosca_testbin --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cosca_testbin") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -x "$BIN"
          HELPER="${RUNNER_TEMP}/cosca_testbin_setuid"
          cp "$BIN" "$HELPER"
          sudo chown root:root "$HELPER"
          sudo chmod 4755 "$HELPER"
          echo "COSCA_TEST_SETUID_HELPER=$HELPER" >> "$GITHUB_ENV"

      - name: Run setuid-root process-group teardown test (Linux)
        if: matrix.os == 'linux'
        run: cargo test --locked --target ${{ matrix.target }} --test group_teardown_setuid -- --ignored
