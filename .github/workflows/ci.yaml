name: CI

on:
  pull_request:

jobs:
  mutant:
    name: Windows early-WAIT_TIMEOUT mutant (review of #344, throwaway)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run the SharedChild WaitForSingleObject deadline tests 40 times under the mutant
        shell: bash
        run: |
          cargo test --locked --lib --no-run
          pass=0; fail=0
          for i in $(seq 1 40); do
            if cargo test --locked --lib -- --exact child::shared::shared_tests::windows::a_deadline_wait_for_single_object_arms_the_remaining_time child::lifecycle_tests::std_child_consecutive_frozen_waits_never_return_early > "out_$i.txt" 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1)); tail -25 "out_$i.txt"
            fi
          done
          echo "MUTANT_RESULT pass=$pass fail=$fail"
