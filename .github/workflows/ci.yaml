name: CI

on:
  pull_request:

jobs:
  probe:
    name: adv455i probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe
        working-directory: .github/scripts
        run: python3 adv455i_probe.py
