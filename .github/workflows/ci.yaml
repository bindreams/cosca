name: CI

# THROWAWAY (PR #310): mutants, and hang-rate loops with and without the settle fix.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.137"
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: ${{ matrix.what }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
        what: [mutants, loop-fixed, loop-prefix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pre-fix tree
        if: matrix.what == 'loop-prefix'
        shell: bash
        run: |
          mv mutants "$RUNNER_TEMP/mutants"
          git fetch --depth 1 origin 1ae39e9adfae01b43808700c8d4a6ace3cb77ced
          git checkout -q 1ae39e9adfae01b43808700c8d4a6ace3cb77ced
          mv "$RUNNER_TEMP/mutants" mutants
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: OS version
        run: sw_vers
      - name: Baseline (nextest)
        if: matrix.what == 'mutants'
        run: cargo nextest run --locked --lib --profile ci -E 'test(/^test_support::/)'
      - name: Baseline (plain cargo test)
        if: ${{ !cancelled() && matrix.what == 'mutants' }}
        run: cargo test --locked --lib 'test_support::'
      - name: Baseline (release)
        if: ${{ !cancelled() && matrix.what == 'mutants' }}
        run: cargo nextest run --locked --release --lib --profile ci -E 'test(/^test_support::/)'
      - name: Mutants
        if: ${{ !cancelled() && matrix.what == 'mutants' }}
        run: bash mutants/run.sh
      - name: Loop
        if: matrix.what != 'mutants'
        run: bash mutants/loop.sh 300
