name: CI

on:
  pull_request:

jobs:
  probe:
    name: adv455h probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe sigwait and forward.py
        timeout-minutes: 15
        shell: bash
        working-directory: .github/scripts
        run: python3 adv455h_probe.py
      - name: Suite x20
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        working-directory: .github/scripts
        run: |
          for i in $(seq 1 20); do
            start=$(python3 -c 'import time; print(time.monotonic())')
            python3 -m unittest forward_tests run_nextest_tests > "$RUNNER_TEMP/suite-$i.log" 2>&1; st=$?
            end=$(python3 -c 'import time; print(time.monotonic())')
            echo "run $i status $st $(python3 -c "print(round($end-$start,2))")s"
            if [ "$st" != 0 ]; then grep -E '^(FAIL|ERROR|AssertionError)' "$RUNNER_TEMP/suite-$i.log"; fi
          done
      - name: Suite x10 under CPU load
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        working-directory: .github/scripts
        run: |
          n=$(( $(sysctl -n hw.ncpu) * 3 ))
          pids=()
          for _ in $(seq 1 "$n"); do yes > /dev/null & pids+=($!); done
          for i in $(seq 1 10); do
            start=$(python3 -c 'import time; print(time.monotonic())')
            python3 -m unittest forward_tests run_nextest_tests > "$RUNNER_TEMP/load-$i.log" 2>&1; st=$?
            end=$(python3 -c 'import time; print(time.monotonic())')
            echo "load run $i status $st $(python3 -c "print(round($end-$start,2))")s"
            if [ "$st" != 0 ]; then grep -E '^(FAIL|ERROR|AssertionError)' "$RUNNER_TEMP/load-$i.log"; fi
          done
          kill "${pids[@]}"
