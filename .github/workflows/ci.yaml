name: CI
on:
  pull_request:
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          uname -a; cat /etc/os-release | head -2; docker version --format '{{.Server.Version}}'
          gcc -O1 -Wall -o q7 q7-probes/q7.c -lpthread
          docker pull ubuntu:24.04
      - name: probes (privileged throwaway container, no network)
        run: |
          docker run --rm --network none --privileged -v "$PWD":/p:ro ubuntu:24.04 sh /p/q7-probes/run-all-inside.sh /p/q7 2>&1 | tee linux.log
      - name: seccomp
        run: |
          for prof in default q7-probes/seccomp-moby-19.03.15.json q7-probes/seccomp-block-pidfd-enosys.json; do
            echo "=== seccomp profile: $prof"
            if [ "$prof" = default ]; then opt=""; else opt="--security-opt seccomp=$PWD/$prof"; fi
            docker run --rm --network none $opt -v "$PWD":/p:ro ubuntu:24.04 /p/q7 seccomp 2>&1
          done
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sw_vers; uname -a
          cc -O1 -Wall -o macos q7-probes/macos.c
          ./macos
