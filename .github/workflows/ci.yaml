name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let main / dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Every job here runs unprivileged unless it says otherwise, so the tests that only mean
  # something as root opt out (principles 9 and 10).
  COSCA_TEST_ROOT: "0"
  # One place for values several jobs share. `.config/nextest.toml`, windows-probes.yaml and the devvm provision scripts carry the same nextest version; Renovate moves them together (.github/renovate.json).
  NEXTEST_VERSION: "0.9.146"
  # The root lanes' binaries, narrowed by `SKULD_LABELS=root`. Name only skuld binaries: a libtest
  # binary ignores `SKULD_LABELS` and would run whole. `process_root`'s test is the `UID_SWITCH` group.
  PRIVILEGE_TESTS: "binary(cosca) | binary(process_root)"
  # Real uid switching needs real root that can `setuid`; only those lanes turn it on.
  COSCA_TEST_UID_SWITCH: "0"
  # System-affecting groups are off workflow-wide; each lane opts back in on its own steps.
  COSCA_TEST_NAMESPACES: "0"
  # The tracer tests run in the two tracer steps of the test job below.
  COSCA_TEST_TRACER: "0"
  # The setuid group runs only where a step provisions a setuid-root helper and opts back in.
  COSCA_TEST_SETUID: "0"
  # The cgroup tests need a delegated cgroup; only the cgroup lane below runs them.
  COSCA_TEST_CGROUP: "0"
  # The elevation tests gain real administrator or root privileges; only the elevation steps of the test job run them.
  COSCA_TEST_ELEVATION: "0"
  # Windows groups. The drive-mapping test and the canaries run in steps of the test job; the executing probes run
  # only in windows-probes.yaml.
  COSCA_TEST_DRIVE_MAPPING: "0"
  COSCA_TEST_PATH_PROBES: "0"
  COSCA_TEST_SHELL_EXECUTE: "0"
  COSCA_TEST_SHELL_PROBES: "0"
  COSCA_TEST_ELEVATION_ROUTES: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Measured: 164 s to 242 s in four runs. 25 min is 6x the slowest, a failure bound for a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # setup-rust so the cargo-fmt / cargo-clippy prek hooks (language = "system")
      # find a toolchain.
      # The targets are the ones check-disallowed-methods.sh lints its fixture for,
      # plus musl for the build check below.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-pc-windows-msvc,x86_64-unknown-linux-musl

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # prek.toml is the single source of truth for lint — the same checks run
      # locally as git hooks. prek-action runs `prek run --all-files`.
      # The libtest guard hook is skipped: the Test job runs it, per target and over the feature powerset.
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
        env:
          SKIP: libtest-guard
        with:
          prek-version: 0.5.3

      - name: Test devvm scripts
        run: python3 -m unittest scripts.devvm_macos_gate_test scripts.devvm_macos_gateio_test scripts.devvm_macos_tart_test scripts.devvm_test scripts.devvm_macos_test scripts.devvm_macos_signals_test scripts.devvm_macos_realtart_test scripts.devvm_vagrantfiles_test scripts.devvm_linux_rust_test

      - name: Test release helper scripts
        shell: bash
        run: bash .github/scripts/release-script-tests.sh

      - name: Test sccache fallback script
        shell: bash
        run: bash .github/scripts/enable-sccache-tests.sh

      - name: Test the signal forwarding and nextest wrapper scripts
        shell: bash
        working-directory: .github/scripts
        run: python3 -m unittest -f forward_tests run_nextest_tests unattended_gui_elevation_tests

      # Forces pid reuse in a fresh PID namespace, so it needs root.
      - name: Test the signal forwarding script against pid reuse
        shell: bash
        run: sudo python3 .github/scripts/forward_reuse_tests.py

      # musl has broken the build before (#172: msghdr/cmsghdr field types differ from glibc).
      # --lib only: the dev-dependencies' C code (libsqlite3-sys) needs a musl C compiler.
      - name: Check the library builds for musl
        shell: bash
        run: cargo check --locked --all-features --lib --target x86_64-unknown-linux-musl

      # scripts/skuld-rewrite is a standalone crate, so neither prek's
      # root-package hooks nor the clippy steps below reach it.
      - name: Test the skuld-rewrite tool
        shell: bash
        working-directory: scripts/skuld-rewrite
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked

      # Regression check for clippy.toml's disallowed-methods bans (see that file): lints
      # .github/fixtures/disallowed-methods, a standalone crate that calls every banned path,
      # against the real clippy.toml, and asserts the diagnostic actually fires for each —
      # structured JSON, not scraped text. Catches a renamed disallowed-methods key, a typo'd
      # path, or a dependency upgrade that silently moves a function out from under the ban.
      # `!cancelled()`: same override-success() rationale as the step below.
      - name: Check the disallowed-methods bans still fire
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/check-disallowed-methods.sh

      # The prek `cargo-clippy` hook above calls .github/scripts/clippy.sh with
      # neither --target nor --feature-powerset (host, no features) — this crate
      # declares no `default` feature, so the host (Linux) side of the
      # feature-gated tokio/pty/serde code paths (and any feature-gated dead
      # code among them) is never linted by the hook alone.
      #
      # Placed after the local-parity checks above, not right after checkout,
      # for the same reason as the test job's Clippy step below: a failure here
      # would otherwise skip `Test release helper scripts` and hide its result.
      # `!cancelled()`: same override-success() rationale as that step.
      - name: Clippy (feature powerset)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/clippy-powerset

      # `cfg(not(debug_assertions))` code (release-only branches and their tests) is compiled by no
      # debug build, so the step above never lints it, and neither do clippy.toml's bans. The
      # powerset action installed cargo-hack.
      - name: Clippy (feature powerset, release)
        if: ${{ !cancelled() }}
        shell: bash
        run: .github/scripts/clippy.sh --feature-powerset --release

  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # `other` is the OS's other architecture: the libtest guard's self-test compiles for it.
        include:
          - os: linux
            arch: amd64
            # 26.04: the elevation lane needs polkit 0.106 or later, and its `polkit.service` is
            # `Type=notify-reload` there. The root lanes' containers run `ubuntu:26.04`, the runner's own glibc.
            runner: ubuntu-26.04
            root_image: ubuntu:26.04
            target: x86_64-unknown-linux-gnu
            other: aarch64-unknown-linux-gnu
            nextest: exec python3 .github/scripts/run-nextest.py
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            root_image: ubuntu:24.04
            target: aarch64-unknown-linux-gnu
            other: x86_64-unknown-linux-gnu
            nextest: exec python3 .github/scripts/run-nextest.py
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            other: x86_64-apple-darwin
            nextest: exec python3 .github/scripts/run-nextest.py
            # This is the one darwin lane that also runs the feature-powerset
            # Clippy step below; see there for why one arch stands in for both.
            lint: true
          - os: darwin
            arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
            other: aarch64-apple-darwin
            nextest: exec python3 .github/scripts/run-nextest.py
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            other: aarch64-pc-windows-msvc
            nextest: ./.github/scripts/run-nextest.ps1
            # This is the one Windows lane that also runs the feature-powerset
            # Clippy step below; see there for why one arch stands in for both.
            lint: true
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            other: x86_64-pc-windows-msvc
            nextest: ./.github/scripts/run-nextest.ps1

    runs-on: ${{ matrix.runner }}
    # PLACEHOLDER while the consolidated jobs are measured.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }},${{ matrix.other }}
          # The libtest guard runs clippy-driver on every lane; the Clippy steps only on the matrix.lint ones.
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-hack@0.6.45

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      # Each nextest step is a build step (unbounded: compile time varies with the cache) and a run
      # step bounded above the largest per-test bound in `.config/nextest.toml` (5 x 60s + 1s grace)
      # plus the suite's runtime, so a hang costs one step. On Unix the runner signals only the
      # step's top-level shell when the bound fires. A run step therefore `exec`s
      # .github/scripts/run-nextest.py (`matrix.nextest`), so the signal lands on forward.py's loop,
      # which relays it to the command's whole process group. The script also selects the step's own
      # nextest profile `ci-<step>` (.config/nextest.toml) and collects that profile's JUnit file, if
      # the run ended on its own. Windows uses run-nextest.ps1 instead: two ACL tests fail when
      # nextest runs under Git bash.
      - name: Build tests
        run: cargo nextest run --locked --no-run --target ${{ matrix.target }} --profile ci

      - name: Run tests
        timeout-minutes: 8
        run: ${{ matrix.nextest }} tests cargo nextest run --locked --target ${{ matrix.target }}

      # The one Windows test that maps a drive letter (`DefineDosDeviceW`, visible to the whole
      # logon session) is the `DRIVE_MAPPING` group, off everywhere else.
      - name: Run the drive-mapping test (Windows)
        if: matrix.os == 'windows'
        timeout-minutes: 8
        env:
          COSCA_TEST_DRIVE_MAPPING: "1"
          COSCA_TEST_DRIVE_MAPPING_CONSENT: "1"
          SKULD_LABELS: drive_mapping
        run: >-
          ${{ matrix.nextest }} drive-mapping
          cargo nextest run --locked --target ${{ matrix.target }}
          --test windows_process_cwd --no-tests=fail

      # `pty` is an additive feature flag; exercise the feature-gated code paths.
      - name: Build tests (pty feature)
        run: cargo nextest run --locked --no-run --features pty --target ${{ matrix.target }} --profile ci

      - name: Run tests (pty feature)
        timeout-minutes: 8
        run: ${{ matrix.nextest }} pty cargo nextest run --locked --features pty --target ${{ matrix.target }}


      - name: Build tests (tokio feature)
        run: cargo nextest run --locked --no-run --features tokio --target ${{ matrix.target }} --profile ci

      - name: Run tests (tokio feature)
        timeout-minutes: 8
        run: ${{ matrix.nextest }} tokio cargo nextest run --locked --features tokio --target ${{ matrix.target }}

      # The `TRACER` group attaches a tracer to the tests' own children, as a debugger would; a CI
      # runner is the sandbox, so this step consents. Windows has no tracer tests.
      # `-E 'binary(cosca)'` keeps libtest binaries out: they ignore `SKULD_LABELS`. `tokio` is for
      # the group's one async test.
      - name: Run the tracer tests (Unix)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        timeout-minutes: 8
        env:
          COSCA_TEST_TRACER: "1"
          COSCA_TEST_TRACER_CONSENT: "1"
          SKULD_LABELS: tracer
        run: ${{ matrix.nextest }} tracer cargo nextest run --locked --no-tests=fail --features tokio --target ${{ matrix.target }} -E 'binary(cosca)'


      # `serde` is an additive feature flag; exercise the persisted-identity wire format.
      - name: Build tests (serde feature)
        run: cargo nextest run --locked --no-run --features serde --target ${{ matrix.target }} --profile ci

      - name: Run tests (serde feature)
        timeout-minutes: 8
        run: ${{ matrix.nextest }} serde cargo nextest run --locked --features serde --target ${{ matrix.target }}


      # nextest does not run doctests (https://github.com/nextest-rs/nextest/issues/16), so they use
      # `cargo test --doc`. On Unix the runner signals only the step's top-level shell when the
      # bound fires, and `cargo test` does not forward that to the doctest it spawned, so
      # .github/scripts/forward.py relays the signal to the whole process group.
      #
      # Measured over 9 green runs: at most 6s on Linux, 5s on macOS and 9s on Windows. 2 minutes is
      # 13x the worst of those, and covers a cold-cache compile of the library, which the `Build`
      # step measures at up to 84s.
      - name: Run doctests (Unix)
        if: matrix.os == 'linux' || matrix.os == 'darwin'
        timeout-minutes: 2
        shell: bash
        run: exec python3 .github/scripts/forward.py cargo test --locked --no-fail-fast --doc --all-features --target ${{ matrix.target }}

      # The forwarding scripts run on every Unix lane of the workflow; Linux is covered by the Lint job.
      # macOS differs: forward.py waits for signals with a kqueue there, because `sigwait` loses a
      # signal when a second, different one arrives during the wait, and a group holding only zombies
      # may refuse a signal.
      - name: Test the signal forwarding and nextest wrapper scripts (macOS)
        if: matrix.os == 'darwin'
        timeout-minutes: 2
        shell: bash
        working-directory: .github/scripts
        run: python3 -m unittest -f forward_tests run_nextest_tests

      # Evidence, alongside the deterministic cases above: signals that arrive within a wake-up of
      # each other, and an exit with a signal, never stick or crash the forwarder on macOS. The count
      # only repeats the run; no run depends on it.
      - name: Repeat the signal-sensitive forwarding tests (macOS)
        if: matrix.os == 'darwin'
        timeout-minutes: 5
        shell: bash
        working-directory: .github/scripts
        run: |
          set -euo pipefail
          for _ in $(seq 40); do
            python3 -m unittest -f forward_tests.Waiting forward_tests.Relay forward_tests.SpawnWindow
          done

      - name: Run doctests (Windows)
        if: matrix.os == 'windows'
        timeout-minutes: 2
        run: cargo test --locked --no-fail-fast --doc --all-features --target ${{ matrix.target }}

      - name: Check rustdoc
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked --target "$TARGET"

      - name: Assert the package excludes test-only paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Write outside the workspace. A listing file created in the package
          # root becomes an uncommitted, non-excluded file that cargo sees as a
          # dirty worktree — the guard would abort before ever running.
          LIST="${RUNNER_TEMP}/pkg-list.txt"
          cargo package --list --locked --target "$TARGET" > "$LIST"

          set +e
          grep -qE '^(testbin/|tests/|\.github/|\.claude/|\.config/|prek\.toml$)' "$LIST"
          grep_status=$?
          set -e

          case "$grep_status" in
            0)
              echo "::error::Excluded paths leaked into the package:"
              grep -E '^(testbin/|tests/|\.github/|\.claude/|\.config/|prek\.toml$)' "$LIST"
              exit 1
              ;;
            1) echo "no excluded paths in the package" ;;
            *)
              echo "::error::grep errored (exit $grep_status); exclusion unverified"
              exit 1
              ;;
          esac

      # Release lane (debug_assertions off): exercises the calm-release arm of the
      # should_panic oracles in the macOS-gated kinfo_tests.rs, and the Linux cgroup tests of what
      # release builds do where debug builds assert a broken precondition instead.
      - name: Build unit tests (release — debug_assertions off)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        run: cargo nextest run --locked --no-run --release --lib --target ${{ matrix.target }} --profile ci

      - name: Unit tests (release — debug_assertions off)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        timeout-minutes: 8
        run: ${{ matrix.nextest }} release cargo nextest run --locked --release --lib --target ${{ matrix.target }}


      # The same lane with `tokio`: `tokio::wait_tests` pins `arm_at`'s calm-release arm (a deadline
      # inside tokio's timer margin waits unbounded where debug builds assert).
      - name: Build unit tests (release — debug_assertions off, tokio feature)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        run: cargo nextest run --locked --no-run --release --lib --features tokio --target ${{ matrix.target }} --profile ci

      - name: Unit tests (release — debug_assertions off, tokio feature)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        timeout-minutes: 8
        run: ${{ matrix.nextest }} release-tokio cargo nextest run --locked --release --lib --features tokio --target ${{ matrix.target }}

      # The tracer tests with `debug_assertions` off too.
      - name: Run the tracer tests (release — debug_assertions off)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        timeout-minutes: 8
        env:
          COSCA_TEST_TRACER: "1"
          COSCA_TEST_TRACER_CONSENT: "1"
          SKULD_LABELS: tracer
        run: ${{ matrix.nextest }} tracer-release cargo nextest run --locked --no-tests=fail --release --lib --features tokio --target ${{ matrix.target }}


      # `#[cfg(windows)]` code (including feature-gated code, e.g. tokio's raw
      # backend) and `cfg(target_os = "macos")` code are otherwise never
      # linted: the `lint` job only runs on ubuntu-latest, so clippy never
      # type-checks either against a Windows or macOS target.
      #
      # --feature-powerset, not --all-features: this crate has real dead_code
      # gaps that only a default-features-only build exposes, which
      # --all-features alone never catches.
      #
      # Placed after the test steps above (including the darwin and Linux release
      # lane just above), not right after Build: a clippy failure there would
      # skip every later step (their implicit `if: success()`), hiding test
      # results.
      #
      # `!cancelled()` is the one step in this job that overrides that implicit
      # `success()`: it makes this step run even after an earlier step in the
      # job has failed, so the lint result is always reported instead of being
      # hidden behind an earlier failure.
      #
      # Runs once per OS (windows/amd64, darwin/arm64), not once per arch
      # (matrix.lint is set on exactly these two entries): nothing in this
      # crate's Windows or macOS code is `cfg(target_arch = ...)`-gated
      # (checked: no such attribute exists in the tree), so within each OS the
      # two arches type-check and lint identically. Linting every arch would
      # double the Windows and macOS runner-minutes spent on lint for no
      # additional coverage.
      - name: Clippy (feature powerset)
        if: ${{ !cancelled() && matrix.lint }}
        uses: ./.github/actions/clippy-powerset
        with:
          target: ${{ matrix.target }}

      # `cfg(not(debug_assertions))` code on this OS is compiled by no debug build, so neither the
      # step above nor clippy.toml's bans reach it.
      - name: Clippy (feature powerset, release)
        if: ${{ !cancelled() && matrix.lint }}
        uses: ./.github/actions/clippy-powerset
        with:
          target: ${{ matrix.target }}
          release: "true"

      # Live cgroup v2 containment tests belong to the CGROUP group: on unless
      # COSCA_TEST_CGROUP=0 (this workflow's default), and, enabled, they need
      # COSCA_TEST_CGROUP_CONSENT=1 and fail without it. They need a cgroup the supervisor may
      # create child cgroups under. We make a fresh leaf directly under the unified root cgroup:
      # its `cgroup.subtree_control` is empty, so the v2 "no internal processes"
      # rule does not apply and a cgroup may hold BOTH the test process and a child
      # leaf. We move our shell into it and run the labelled tests there (as root, in
      # parallel) — across the `--lib` unit-test binary (which carries the white-box
      # CgroupLeaf::wait_drained coverage in src/containment/cgroup/leaf_tests.rs, and with `tokio` the
      # async spawn's post-fork failure path), `spawn_io` and `tokio_io`. `CGROUP` means this lane: a
      # delegated cgroup, with the `unshare` that container seccomp profiles refuse permitted. The
      # tests assert CgroupV2/build a real leaf and FAIL LOUDLY if it is unusable — never a silent skip.
      #
      # The labels: `cgroup` (the CGROUP group, every test of `containment::cgroup`, and the tests
      # labelled `cgroup` explicitly, which keep in this lane what the old `test(/cgroup/)` name filter selected;
      # most use fake leaves and also run in the main lanes) and `namespaces` (the NAMESPACES group, which also gets its own consent here: root, on a
      # CI runner). `-E binary(...)`: libtest binaries ignore `SKULD_LABELS` and would run whole.
      #
      # The unprivileged runner user builds the archive; only running it needs root. `sudo`'s
      # `secure_path` drops `~/.cargo/bin`, so `cargo-nextest`'s resolved path and the archive are
      # passed in as positional arguments rather than looked up again inside the root shell.
      - name: Build cgroup v2 containment tests (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          cargo nextest archive --locked --features pty,tokio --target ${{ matrix.target }} --archive-file "$RUNNER_TEMP/cgroup.tar.zst"

      - name: Run cgroup v2 containment and namespace tests (Linux)
        if: matrix.os == 'linux'
        timeout-minutes: 8
        shell: bash
        run: |
          # shellcheck disable=SC2016 # the root shell expands its own positional arguments
          exec python3 .github/scripts/run-nextest.py cgroup sudo -E "$(command -v python3)" .github/scripts/forward.py bash -uxc '
            CG=/sys/fs/cgroup/cosca-ci
            mkdir -p "$CG"
            echo $$ > "$CG/cgroup.procs"
            # A delegated cgroup and root on a CI runner, which is the sandbox, so consent is given.
            # The profile is passed explicitly: the `sudo` of Ubuntu 26.04 does not keep NEXTEST_PROFILE under `-E`.
            export COSCA_TEST_CGROUP=1 COSCA_TEST_CGROUP_CONSENT=1
            export COSCA_TEST_NAMESPACES=1 COSCA_TEST_NAMESPACES_CONSENT=1
            status=0
            SKULD_LABELS="cgroup | namespaces" "$0" nextest run --archive-file "$1" --workspace-remap "$PWD" --profile ci-cgroup --no-capture --no-tests=fail -E "binary(cosca) | binary(spawn_io) | binary(tokio_io)" || status=1
            # Hand the target dir back so later steps can write to it.
            chown -R "$2" "$PWD/target"
            exit "$status"
          ' "$(command -v cargo-nextest)" "$RUNNER_TEMP/cgroup.tar.zst" "$(id -u):$(id -g)"

      # The setuid group (`COSCA_TEST_SETUID`, off workflow-wide). It needs a COPY of cosca_testbin
      # that is genuinely setuid-root (owned by root, mode u+s), so a helper process can become
      # truly unsignalable by this job's ordinary unprivileged user, giving a REAL mixed process
      # group. Only preparing the helper copy needs root; the tests run as the normal runner user,
      # no sudo. The lane check fails the lane unless the helper really reaches uid 0 and may
      # create a user namespace. The group is selected by its label (`SKULD_LABELS=setuid`), in the
      # two binaries that carry it (see principle 10).
      - name: Set up setuid-root helper (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          BIN=$(cargo build --locked --target ${{ matrix.target }} --bin cosca_testbin --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cosca_testbin") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -x "$BIN"
          HELPER="${RUNNER_TEMP}/cosca_testbin_setuid"
          cp "$BIN" "$HELPER"
          sudo chown root:root "$HELPER"
          sudo chmod 4755 "$HELPER"
          echo "COSCA_TEST_SETUID_HELPER=$HELPER" >> "$GITHUB_ENV"

      - name: Check the setuid lane (Linux)
        if: matrix.os == 'linux'
        run: bash .github/scripts/setuid-lane-check.sh "$COSCA_TEST_SETUID_HELPER"

      - name: Build setuid tests (Linux)
        if: matrix.os == 'linux'
        run: cargo nextest run --locked --no-run --features tokio --target ${{ matrix.target }} --profile ci -E 'binary(cosca) | binary(group_teardown_setuid)'

      - name: Run setuid tests (Linux)
        if: matrix.os == 'linux'
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_TEST_SETUID: "1"
          COSCA_TEST_SETUID_CONSENT: "1"
          SKULD_LABELS: setuid
        run: exec python3 .github/scripts/run-nextest.py setuid cargo nextest run --locked --no-tests=fail --features tokio --target ${{ matrix.target }} -E 'binary(cosca) | binary(group_teardown_setuid)'

      # The same test started as root re-executes itself as uid 65534 (see the test file's "Running
      # as root" docs), so the test binary, the `cosca_testbin` path compiled into it, and the
      # helper must all be reachable by that uid: every directory above the checkout and the
      # extraction directory is made traversable and `target` readable. `--extract-to` is what lets
      # nextest run an archive there: its default extraction directory is root-only. `sudo -E` keeps
      # COSCA_TEST_SETUID_HELPER and the group's variables.
      - name: Archive the setuid-root process-group teardown test (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          cargo nextest archive --locked --target ${{ matrix.target }} --test group_teardown_setuid --archive-file "$RUNNER_TEMP/setuid-root.tar.zst"
          mkdir -m 0755 "$RUNNER_TEMP/setuid-root-extract"
          chmod -R a+rX "$PWD/target"
          d="$PWD"
          while [ "$d" != / ]; do sudo chmod a+x "$d"; d=$(dirname "$d"); done
          sudo chmod a+x "$RUNNER_TEMP"

      - name: Run setuid-root process-group teardown test as root (Linux)
        if: matrix.os == 'linux'
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_TEST_SETUID: "1"
          COSCA_TEST_SETUID_CONSENT: "1"
          SKULD_LABELS: setuid_root
        run: |
          # shellcheck disable=SC2016 # the root shell expands its own positional arguments
          exec python3 .github/scripts/run-nextest.py setuid-root sudo -E "$(command -v python3)" .github/scripts/forward.py bash -euxc '
            "$0" nextest run --archive-file "$1" --extract-to "$2" --workspace-remap "$PWD" --profile ci-setuid-root --no-tests=fail -E "binary(group_teardown_setuid)"
          ' "$(command -v cargo-nextest)" "$RUNNER_TEMP/setuid-root.tar.zst" "$RUNNER_TEMP/setuid-root-extract"


      # The libtest guard (.github/scripts/libtest_guard.py) checks that the test suite is complete: no
      # built-in `#[test]` in a `harness = false` target, where it would silently never run. It runs
      # on every lane, not once per OS like the Clippy steps: a test gated on `target_arch` is only
      # seen when the guard compiles for that architecture. Both profiles, over the feature powerset.
      #
      # Placed after every test step, just before the JUnit upload: a guard failure must not skip the
      # Linux-only steps above, which have no `!cancelled()`. Its debug
      # library units are the ones `Build tests` built, and its type-checked test targets the ones
      # Clippy checked, so cargo reuses them. `!cancelled()`: reported even after an earlier failure.
      - name: Libtest guard
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: uv run --script .github/scripts/libtest_guard.py --feature-powerset --both-profiles --target "$TARGET"

      # Runs the guard on .github/fixtures/libtest-guard, natively and for `matrix.other`.
      - name: Test the libtest guard
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LIBTEST_GUARD_OTHER_TARGET: ${{ matrix.other }}
        run: uv run --script .github/scripts/libtest_guard_tests.py

      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-junit
        with:
          name: test-${{ matrix.os }}-${{ matrix.arch }}

      # Lanes that run after the unprivileged tests =====
      #
      # Every lane below is a step group of this required job. Order: the Windows canaries, then the root
      # lanes, then elevation. `unattended-gui-elevation.py` changes system policy, so elevation goes last as a
      # second line of defence; correctness does not rest on it. Every step that reverts a lane's changes runs
      # `always()`, straight after its own lane. The lanes' steps run `!cancelled()`, so one red lane does not hide
      # another, and each step also requires its own lane's earlier step to have succeeded. Each lane's
      # `COSCA_TEST_<GROUP>` variables are set on its own steps, never job-wide.

      # Windows path-resolution canaries and the elevating ShellExecuteEx probes (the `PATH_PROBES` and
      # `SHELL_EXECUTE` groups). `--no-capture`: the surveys report only through stdout, and every canary prints
      # what it measured before asserting on it. Each canary that passes leaves a marker named after itself
      # (`mark_canary_passed`). windows-probes.yaml runs the same canaries weekly, because `windows-latest` floats.
      - name: Windows canaries - path resolution
        id: win_canary
        if: ${{ !cancelled() && matrix.os == 'windows' }}
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/canary-markers
          COSCA_TEST_PATH_PROBES: "1"
          COSCA_TEST_PATH_PROBES_CONSENT: "1"
          SKULD_LABELS: path_probes
          TARGET: ${{ matrix.target }}
        run: |
          mkdir "$COSCA_CANARY_MARKERS"
          cargo nextest run --locked --profile ci --target "$TARGET" --test windows_path_resolution --no-capture --no-tests=fail

      # A canary filter matching nothing would otherwise pass having asserted nothing. Runs after a failure too,
      # so the log shows which canaries passed.
      - name: Windows canaries - require that a canary ran
        if: ${{ !cancelled() && matrix.os == 'windows' }}
        shell: bash
        env:
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/canary-markers
        run: |
          shopt -s nullglob
          passed=("$COSCA_CANARY_MARKERS"/*)
          if ((${#passed[@]} == 0)); then
            echo "::error::no canary ran: the run asserted nothing about the platform"
            exit 1
          fi
          printf 'canary passed: %s\n' "${passed[@]##*/}"

      # These elevate through ShellExecuteEx(runas), which a runner already elevated grants without a prompt, and
      # register one volatile App Paths key in HKLM and one in HKCU, deleting each again; a volatile parent key
      # they had to create can stay behind until the next logon session. They measure an ELEVATED caller's launch,
      # not the consent route cosca takes from an unelevated one. They share machine-wide state (the App Paths
      # keys) and must not run concurrently; `--no-capture` and the `windows-shell-execute` test group (one thread,
      # `.config/nextest.toml`) both guarantee that.
      - name: Windows canaries - elevating ShellExecuteEx probes
        if: ${{ !cancelled() && matrix.os == 'windows' }}
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/elevating-markers
          COSCA_TEST_SHELL_EXECUTE: "1"
          COSCA_TEST_SHELL_EXECUTE_CONSENT: "1"
          SKULD_LABELS: shell_execute
          TARGET: ${{ matrix.target }}
        run: |
          mkdir "$COSCA_CANARY_MARKERS"
          cargo nextest run --locked --profile ci --target "$TARGET" --test windows_shell_execute --no-capture --no-tests=fail

      - name: Windows canaries - require that an elevating probe ran
        if: ${{ !cancelled() && matrix.os == 'windows' }}
        shell: bash
        env:
          COSCA_CANARY_MARKERS: ${{ runner.temp }}/elevating-markers
        run: |
          shopt -s nullglob
          passed=("$COSCA_CANARY_MARKERS"/*)
          if ((${#passed[@]} == 0)); then
            echo "::error::no elevating probe ran: the run asserted nothing about ShellExecuteEx"
            exit 1
          fi
          printf 'elevating probe passed: %s\n' "${passed[@]##*/}"

      # Root lanes (Linux) =====
      #
      # The unit tests that need root or a DAC-bypass capability (`PRIVILEGE_TESTS`); the steps above are
      # unprivileged and opt out of them (`COSCA_TEST_ROOT=0`). Each lane runs the nextest archive in a container
      # (.github/actions/root-lane), so it needs no toolchain there. Before nextest, `root-lane-check.sh` fails the
      # lane unless its EXPECT_* privilege state holds. The archive reuses the build of `Build tests`.
      #
      # The container image matches the runner's glibc (`matrix.root_image`): the runner built the test binaries.
      #
      # What each lane adds:
      #   root:           the base case.
      #   unshare -r:     root in a fresh user namespace, which holds `CAP_DAC_READ_SEARCH`.
      #   DAC_READ_SEARCH: root with that capability added directly.
      #   foreign TMPDIR: an ambient `TMPDIR` the dropped identity cannot search.
      #   uid 1000:       not root, `CAP_DAC_OVERRIDE` ambient. The exec-child test runs (its
      #                   precondition is a DAC bypass, not uid 0), but a non-root `execve` regains
      #                   nothing, so only the root lanes catch a deleted `no_new_privs`.
      # Capability masks: `CAP_DAC_OVERRIDE` is 0x2, `CAP_DAC_READ_SEARCH` is 0x4.
      - name: Root lanes - archive the privilege tests (Linux)
        id: root_archive
        if: ${{ !cancelled() && matrix.os == 'linux' }}
        timeout-minutes: 10
        run: cargo nextest archive --locked --target ${{ matrix.target }} --archive-file "$RUNNER_TEMP/root-lane.tar.zst"

      - name: Root lane (root)
        if: ${{ !cancelled() && steps.root_archive.outcome == 'success' }}
        timeout-minutes: 8
        uses: ./.github/actions/root-lane
        with:
          slug: root
          image: ${{ matrix.root_image }}
          uid_switch: "1"
          expect_uid: "0"
          expect_capeff_has: "0x2"
          expect_capeff_lacks: "0x4"
          expect_capamb: "0x0"
          artifact: resolve_root_lanes-linux-${{ matrix.arch }}-root

      - name: Root lane (root, unshare -r)
        if: ${{ !cancelled() && steps.root_archive.outcome == 'success' }}
        timeout-minutes: 8
        uses: ./.github/actions/root-lane
        with:
          slug: unshare
          image: ${{ matrix.root_image }}
          uid_switch: "0" # `unshare -r` maps no uid 65534
          docker_flags: "--cap-add SYS_ADMIN" # `unshare -r` needs it
          prefix: "unshare -r "
          expect_uid: "0"
          expect_capeff_has: "0x6"
          expect_capeff_lacks: "0x0"
          expect_capamb: "0x0"
          expect_userns: "1"
          artifact: resolve_root_lanes-linux-${{ matrix.arch }}-unshare

      - name: Root lane (root, DAC_READ_SEARCH)
        if: ${{ !cancelled() && steps.root_archive.outcome == 'success' }}
        timeout-minutes: 8
        uses: ./.github/actions/root-lane
        with:
          slug: dac-read-search
          image: ${{ matrix.root_image }}
          uid_switch: "1"
          docker_flags: "--cap-add DAC_READ_SEARCH"
          expect_uid: "0"
          expect_capeff_has: "0x6"
          expect_capeff_lacks: "0x0"
          expect_capamb: "0x0"
          artifact: resolve_root_lanes-linux-${{ matrix.arch }}-dac-read-search

      - name: Root lane (root, foreign TMPDIR)
        if: ${{ !cancelled() && steps.root_archive.outcome == 'success' }}
        timeout-minutes: 8
        uses: ./.github/actions/root-lane
        with:
          slug: foreign-tmpdir
          image: ${{ matrix.root_image }}
          uid_switch: "1"
          expect_uid: "0"
          expect_capeff_has: "0x2"
          expect_capeff_lacks: "0x4"
          expect_capamb: "0x0"
          foreign_tmpdir: "true"
          artifact: resolve_root_lanes-linux-${{ matrix.arch }}-foreign-tmpdir

      - name: Root lane (uid 1000, CAP_DAC_OVERRIDE ambient)
        if: ${{ !cancelled() && steps.root_archive.outcome == 'success' }}
        timeout-minutes: 8
        uses: ./.github/actions/root-lane
        with:
          slug: uid-1000
          image: ${{ matrix.root_image }}
          uid_switch: "0" # not root, so it cannot `setuid`
          prefix: "setpriv --reuid 1000 --regid 1000 --clear-groups --inh-caps +dac_override --ambient-caps +dac_override "
          expect_uid: "1000"
          expect_capeff_has: "0x2"
          expect_capeff_lacks: "0x4"
          expect_capamb: "0x2"
          artifact: resolve_root_lanes-linux-${{ matrix.arch }}-uid-1000

      # Root lane (macOS) =====
      #
      # Root on macOS, where a fixture drops by changing uid and re-execs a copy of the test binary. No container
      # on macOS runners, so this runs under `sudo`. The setuid group runs first, as it did in its own job.
      - name: Root lane (macOS) - set up the setuid-root helper
        id: mac_helper
        if: ${{ !cancelled() && matrix.os == 'darwin' && matrix.arch == 'arm64' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          BIN=$(cargo build --locked --target "$TARGET" --bin cosca_testbin --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cosca_testbin") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -x "$BIN"
          HELPER="${RUNNER_TEMP}/cosca_testbin_setuid"
          cp "$BIN" "$HELPER"
          sudo chown root:wheel "$HELPER"
          sudo chmod 4755 "$HELPER"
          echo "helper=$HELPER" >> "$GITHUB_OUTPUT"

      - name: Root lane (macOS) - check the setuid lane
        id: mac_helper_check
        if: ${{ !cancelled() && steps.mac_helper.outcome == 'success' }}
        shell: bash
        env:
          HELPER: ${{ steps.mac_helper.outputs.helper }}
        run: bash .github/scripts/setuid-lane-check.sh "$HELPER"

      # The tests were built by `Build tests (tokio feature)`.
      - name: Root lane (macOS) - run the setuid tests
        if: ${{ !cancelled() && steps.mac_helper_check.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_TEST_SETUID: "1"
          COSCA_TEST_SETUID_CONSENT: "1"
          COSCA_TEST_SETUID_HELPER: ${{ steps.mac_helper.outputs.helper }}
          SKULD_LABELS: setuid
        run: exec python3 .github/scripts/run-nextest.py setuid cargo nextest run --locked --no-tests=fail --features tokio --target ${{ matrix.target }} -E 'binary(cosca)'

      - name: Root lane (macOS) - archive the privilege tests
        id: mac_root_archive
        if: ${{ !cancelled() && matrix.os == 'darwin' && matrix.arch == 'arm64' }}
        timeout-minutes: 10
        run: cargo nextest archive --locked --target ${{ matrix.target }} --archive-file "$RUNNER_TEMP/root-lane-macos.tar.zst"

      # Two directories:
      # - `TMPDIR`, root-owned 0755. The ambient `TMPDIR` must be searchable by uid 65534, which
      #   the runner user's own per-app `TMPDIR` is not. It is not writable by 65534 either, so a
      #   fixture that ignores its scratch directory fails.
      # - nextest's extraction directory, root-owned 0700. The test binary then sits somewhere uid
      #   65534 cannot enter, so a fixture passes only if the driver re-execs a copy of it.
      # Passed to the run step as outputs, not through `GITHUB_ENV`, so no other step sees them.
      - name: Root lane (macOS) - create root-owned scratch and extraction directories
        id: mac_root_dirs
        if: ${{ !cancelled() && steps.mac_root_archive.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          COSCA_ROOT_TMPDIR="$(sudo mktemp -d /tmp/cosca-root-scratch.XXXXXX)"
          sudo chown root:wheel "$COSCA_ROOT_TMPDIR"
          sudo chmod 0755 "$COSCA_ROOT_TMPDIR"
          COSCA_EXTRACT_DIR="$(sudo mktemp -d /tmp/cosca-root-extract.XXXXXX)"
          sudo chown root:wheel "$COSCA_EXTRACT_DIR"
          sudo chmod 0700 "$COSCA_EXTRACT_DIR"
          {
            echo "extract_dir=$COSCA_EXTRACT_DIR"
            echo "tmpdir=$COSCA_ROOT_TMPDIR"
          } >> "$GITHUB_OUTPUT"

      # `sudo -E` keeps `TMPDIR`. The lane fails unless it really is euid 0 and `TMPDIR` is root-owned. The root
      # shell hands `target` back to the runner user, so later lanes can write to it.
      - name: Root lane (macOS, sudo -E)
        id: mac_root_run
        if: ${{ !cancelled() && steps.mac_root_dirs.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_TEST_ROOT: "1"
          COSCA_TEST_ROOT_CONSENT: "1"
          COSCA_TEST_UID_SWITCH: "1"
          COSCA_TEST_UID_SWITCH_CONSENT: "1"
          TMPDIR: ${{ steps.mac_root_dirs.outputs.tmpdir }}
          COSCA_EXTRACT_DIR: ${{ steps.mac_root_dirs.outputs.extract_dir }}
        run: |
          # shellcheck disable=SC2016 # the root shell expands its own positional arguments
          exec python3 .github/scripts/run-nextest.py root sudo -E "$(command -v python3)" .github/scripts/forward.py bash -euxc '
            test "$(id -u)" = 0
            test "$(stat -f %u "$TMPDIR")" = 0
            status=0
            SKULD_LABELS=root "$0" nextest run --archive-file "$1" --extract-to "$2" --workspace-remap "$PWD" --no-tests=fail -E "$PRIVILEGE_TESTS" || status=1
            chown -R "$3" "$PWD/target"
            exit "$status"
          ' "$(command -v cargo-nextest)" "$RUNNER_TEMP/root-lane-macos.tar.zst" "$COSCA_EXTRACT_DIR" "$(id -u):$(id -g)"

      - name: Root lane (macOS) - upload JUnit
        if: ${{ !cancelled() && steps.mac_helper.outcome != 'skipped' }}
        uses: ./.github/actions/upload-junit
        with:
          name: resolve_root_lane_macos-darwin-arm64
          path: |
            ${{ runner.temp }}/junit/setuid.xml
            ${{ runner.temp }}/junit/root.xml

      - name: Root lane (macOS) - print the process table
        if: ${{ steps.mac_helper.outcome != 'skipped' && (failure() || cancelled()) }}
        timeout-minutes: 2
        run: ps -axo pid,ppid,pgid,stat,etime,command

      # Elevation (Linux) =====
      #
      # The ELEVATION group (`COSCA_TEST_ELEVATION`, off workflow-wide), selected by its label. This is a CI
      # runner, so the group consents. `-E binary(=elevation)`: the only binary with elevation tests; libtest
      # binaries ignore `SKULD_LABELS` and would run whole.
      #
      # polkit allows the runner user every action, so `pkexec` (`Auth::Gui`) asks nothing; the script checks that.
      # TODO(azhukova/revert-system-changes): after the lane's cleanup, run
      # `unattended-gui-elevation.py --revert` (`if: always()`) and remove the apt-installed polkit and doas
      # packages. That PR adds the mode; whichever of the two PRs merges second wires it in here.
      - name: Elevation (Linux) - allow unattended GUI elevation
        id: lin_elev_policy
        if: ${{ !cancelled() && matrix.os == 'linux' && matrix.arch == 'amd64' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/unattended-gui-elevation.py --this-machine-is-disposable --check-only
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y polkitd pkexec opendoas
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 .github/scripts/unattended-gui-elevation.py --this-machine-is-disposable --user "$USER"

      # `doas` lets the runner user run anything as root without a password (the `Backend::Doas` test).
      - name: Elevation (Linux) - provision doas
        id: lin_elev_doas
        if: ${{ !cancelled() && steps.lin_elev_policy.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          printf 'permit nopass %s as root\n' "$USER" | sudo tee /etc/doas.conf >/dev/null
          doas -C /etc/doas.conf
          test "$(doas -n id -u)" = 0

      # Rules and password: see elevation-lane-sudoers.sh. The password goes to the run step as an output, not
      # through `GITHUB_ENV`.
      - name: Elevation (Linux) - provision sudo
        id: lin_elev_sudo
        if: ${{ !cancelled() && steps.lin_elev_doas.outcome == 'success' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # No xtrace here: it would print the password before the mask takes effect.
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          COSCA_TEST_ELEVATION_PASSWORD="$password" bash .github/scripts/elevation-lane-sudoers.sh --this-machine-is-disposable "$USER" "$PWD/target/$TARGET/debug/cosca_testbin"

      - name: Elevation (Linux) - run the elevation tests
        id: lin_elev_run
        if: ${{ !cancelled() && steps.lin_elev_sudo.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_TEST_ELEVATION: "1"
          COSCA_TEST_ELEVATION_CONSENT: "1"
          COSCA_TEST_ELEVATION_PASSWORD: ${{ steps.lin_elev_sudo.outputs.password }}
          SKULD_LABELS: elevation
        run: exec python3 .github/scripts/run-nextest.py elevation cargo nextest run --locked --features tokio --target ${{ matrix.target }} --no-tests=fail -E 'binary(=elevation)'

      - name: Elevation (Linux) - check the JUnit result
        if: ${{ !cancelled() && steps.lin_elev_run.outcome == 'success' }}
        shell: bash
        run: python3 .github/scripts/check-junit.py "$RUNNER_TEMP/junit/elevation.xml" --tests 9

      - name: Elevation (Linux) - print the process table
        if: ${{ steps.lin_elev_run.outcome == 'failure' || steps.lin_elev_run.outcome == 'cancelled' }}
        timeout-minutes: 2
        run: ps -eo pid,ppid,pgid,stat,etime,args

      - name: Elevation (Linux) - remove the sudo rules
        if: ${{ always() && steps.lin_elev_sudo.outcome != 'skipped' && steps.lin_elev_sudo.outcome != '' }}
        shell: bash
        env:
          COSCA_TEST_ELEVATION_PASSWORD: ${{ steps.lin_elev_sudo.outputs.password }}
        run: bash .github/scripts/elevation-lane-sudoers.sh --this-machine-is-disposable --cleanup "$USER"

      - name: Elevation (Linux) - upload JUnit
        if: ${{ !cancelled() && steps.lin_elev_run.outcome != 'skipped' && steps.lin_elev_run.outcome != '' }}
        uses: ./.github/actions/upload-junit
        with:
          name: elevation-linux-amd64
          path: ${{ runner.temp }}/junit/elevation.xml

      # Elevation (macOS) =====
      #
      # The image grants `%admin NOPASSWD:ALL` to the runner user, so the tests run as a throwaway non-admin account
      # (`coscaelev`), which that rule does not reach. `elevation-lane-sudoers.sh` gives it `sudo -n` for `id` and
      # `cosca_testbin` only, and `whoami` asks the password the Stdin and Askpass tests deliver.
      # TODO(azhukova/revert-system-changes): after the lane's cleanup, run
      # `unattended-gui-elevation.py --revert` (`if: always()`), which restores the authorizationdb right. That PR
      # adds the mode; whichever of the two PRs merges second wires it in here.
      - name: Elevation (macOS) - allow unattended GUI elevation
        id: mac_elev_policy
        if: ${{ !cancelled() && matrix.os == 'darwin' && matrix.arch == 'arm64' }}
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 .github/scripts/unattended-gui-elevation.py --this-machine-is-disposable

      # The user runs a nextest archive extracted outside the checkout, which it can read. The tests were built by
      # `Build tests (tokio feature)`.
      - name: Elevation (macOS) - archive the tests
        id: mac_elev_archive
        if: ${{ !cancelled() && steps.mac_elev_policy.outcome == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail
          cargo nextest archive --locked --features tokio --target ${{ matrix.target }} --archive-file "$RUNNER_TEMP/elevation.tar.zst"
          mkdir -m 0777 "$RUNNER_TEMP/elevation-extract"
          chmod -R a+rX "$PWD/target"
          mkdir -p "$PWD/target/nextest/ci-elevation"
          chmod -R a+rwX "$PWD/target/nextest"
          d="$PWD"
          while [ "$d" != / ]; do sudo chmod a+x "$d"; d=$(dirname "$d"); done
          sudo chmod -R a+rX "$HOME/.cargo/bin"
          sudo chmod a+x "$RUNNER_TEMP"

      # No xtrace: the password is handled here. It goes to the run step as an output.
      - name: Elevation (macOS) - create the user and its sudo rules
        id: mac_elev_user
        if: ${{ !cancelled() && steps.mac_elev_archive.outcome == 'success' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          COSCA_TEST_ELEVATION_PASSWORD="$password" bash .github/scripts/elevation-lane-sudoers.sh --this-machine-is-disposable --create-account coscaelev
          # Listing extracts the archive, so the test binaries and `cosca_testbin` belong to the user.
          sudo -u coscaelev -H "$(command -v cargo-nextest)" nextest list --archive-file "$RUNNER_TEMP/elevation.tar.zst" \
            --extract-to "$RUNNER_TEMP/elevation-extract" --workspace-remap "$PWD" > /dev/null
          COSCA_TEST_ELEVATION_PASSWORD="$password" bash .github/scripts/elevation-lane-sudoers.sh --this-machine-is-disposable coscaelev "$RUNNER_TEMP/elevation-extract/target/$TARGET/debug/cosca_testbin"

      - name: Elevation (macOS) - run the elevation tests
        id: mac_elev_run
        if: ${{ !cancelled() && steps.mac_elev_user.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        env:
          COSCA_TEST_ELEVATION_PASSWORD: ${{ steps.mac_elev_user.outputs.password }}
          SELECTION: binary(=elevation)
        # The forwarder runs as root (`sudo -E`), so the step's bound can signal the user's whole process tree.
        run: |
          exec python3 .github/scripts/run-nextest.py elevation sudo -E "$(command -v python3)" .github/scripts/forward.py \
            sudo -u coscaelev -H env \
            COSCA_TEST_ELEVATION=1 COSCA_TEST_ELEVATION_CONSENT=1 SKULD_LABELS=elevation \
            COSCA_TEST_ELEVATION_PASSWORD="$COSCA_TEST_ELEVATION_PASSWORD" NEXTEST_PROFILE=ci-elevation \
            "$(command -v cargo-nextest)" nextest run --archive-file "$RUNNER_TEMP/elevation.tar.zst" \
            --extract-to "$RUNNER_TEMP/elevation-extract" --extract-overwrite --workspace-remap "$PWD" --no-tests=fail -E "$SELECTION"

      - name: Elevation (macOS) - check the JUnit result
        if: ${{ !cancelled() && steps.mac_elev_run.outcome == 'success' }}
        shell: bash
        run: python3 .github/scripts/check-junit.py "$RUNNER_TEMP/junit/elevation.xml" --tests 8

      - name: Elevation (macOS) - print the process table
        if: ${{ steps.mac_elev_run.outcome == 'failure' || steps.mac_elev_run.outcome == 'cancelled' }}
        timeout-minutes: 2
        run: ps -axo pid,ppid,pgid,stat,etime,command

      - name: Elevation (macOS) - remove the user and its sudo rules
        if: ${{ always() && steps.mac_elev_user.outcome != 'skipped' && steps.mac_elev_user.outcome != '' }}
        shell: bash
        run: bash .github/scripts/elevation-lane-sudoers.sh --this-machine-is-disposable --cleanup coscaelev

      - name: Elevation (macOS) - upload JUnit
        if: ${{ !cancelled() && steps.mac_elev_run.outcome != 'skipped' && steps.mac_elev_run.outcome != '' }}
        uses: ./.github/actions/upload-junit
        with:
          name: elevation-darwin-arm64
          path: ${{ runner.temp }}/junit/elevation.xml

      # Elevation (Windows) =====
      #
      # See elevation-lane-windows.ps1 for why the tests run as a fresh local administrator.
      # TODO(azhukova/revert-system-changes): after the lane, run `unattended-gui-elevation.py --revert`
      # (`if: always()`) and make sure the administrator account is removed even when the script is killed. That PR
      # adds both; whichever of the two PRs merges second wires them in here.
      - name: Elevation (Windows) - allow unattended GUI elevation
        id: win_elev_policy
        if: ${{ !cancelled() && matrix.os == 'windows' }}
        shell: pwsh
        run: python .github/scripts/unattended-gui-elevation.py --this-machine-is-disposable

      # The tests were built by `Build tests (tokio feature)`.
      - name: Elevation (Windows) - archive the tests
        id: win_elev_archive
        if: ${{ !cancelled() && steps.win_elev_policy.outcome == 'success' }}
        shell: pwsh
        run: cargo nextest archive --locked --features tokio --target ${{ matrix.target }} --archive-file "$env:RUNNER_TEMP\elevation.tar.zst"

      # Through run-nextest.ps1, which publishes the JUnit file (the `ci-elevation` profile). The throwaway administrator
      # runs nextest from an archive extracted under C:\cosca-elevation-lane.
      - name: Elevation (Windows) - run the elevation tests
        id: win_elev_run
        if: ${{ !cancelled() && steps.win_elev_archive.outcome == 'success' }}
        timeout-minutes: 8
        shell: pwsh
        env:
          NEXTEST_PROFILE: ci-elevation
        run: ./.github/scripts/run-nextest.ps1 elevation pwsh -File ./.github/scripts/elevation-lane-windows.ps1 "$env:RUNNER_TEMP\elevation.tar.zst" (Get-Command cargo-nextest).Source

      - name: Elevation (Windows) - check the JUnit result
        if: ${{ !cancelled() && steps.win_elev_run.outcome == 'success' }}
        shell: bash
        run: python3 .github/scripts/check-junit.py "$RUNNER_TEMP/junit/elevation.xml" --tests 4

      - name: Elevation (Windows) - upload JUnit
        if: ${{ !cancelled() && steps.win_elev_run.outcome != 'skipped' && steps.win_elev_run.outcome != '' }}
        uses: ./.github/actions/upload-junit
        with:
          name: elevation-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/junit/elevation.xml

      # Names the stuck process after a hang or failure. Windows has no `ps`.
      - name: Print the process table (Linux)
        if: (cancelled() || failure()) && matrix.os == 'linux'
        timeout-minutes: 2
        run: ps -eo pid,ppid,pgid,stat,etime,args

      - name: Print the process table (macOS)
        if: (cancelled() || failure()) && matrix.os == 'darwin'
        timeout-minutes: 2
        run: ps -axo pid,ppid,pgid,stat,etime,command

