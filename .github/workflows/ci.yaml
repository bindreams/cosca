name: CI

# THROWAWAY (PR #377 fix round 5): the tracer group x300 on macOS 15 with detach diagnostics, to
# explain one TIMEOUT. Do not merge.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  NEXTEST_VERSION: "0.9.137"
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  loop:
    name: Tracer group x300 with diagnostics (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: OS version
        run: sw_vers
      - name: Build
        run: |
          python3 mutants/diag2.py
          cargo nextest run --locked --lib --no-run
      - name: Loop
        env:
          COSCA_UH_DIAG: "1"
          LOOP_DUMP: "1"
        run: bash mutants/loop.sh 300
