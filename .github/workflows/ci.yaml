name: CI

# THROWAWAY (PR #310): repeat the tracer tests to catch an intermittent S6 hang.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.137"
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: Tracer loop (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build
        run: cargo nextest run --locked --lib --no-run
      - name: Loop
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 40); do
            if ! cargo nextest run --locked --lib --profile ci --no-fail-fast -E 'test(/^test_support::tracer::/)' > "$RUNNER_TEMP/iter-$i.log" 2>&1; then
              fails=$((fails+1))
              echo "=== iteration $i failed"
              grep -aE "FAIL \[|TIMEOUT \[|@@HANG@@|tracer helper report|panicked|left:|right:" "$RUNNER_TEMP/iter-$i.log" | head -120
            fi
          done
          echo "failed iterations: $fails"
