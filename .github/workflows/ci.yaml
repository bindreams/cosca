name: CI

# THROWAWAY (PR #310 Troyka round): the tracer tests and their mutants on both darwin lanes.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.137"
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: Tracer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: OS version
        run: sw_vers
      - name: Baseline (nextest, measurements printed)
        run: cargo nextest run --locked --lib --profile ci --no-capture -E 'test(/^test_support::/)'
      - name: Baseline (plain cargo test)
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib 'test_support::'
      - name: Baseline (release)
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --release --lib --profile ci -E 'test(/^test_support::/)'
      - name: Mutants
        if: ${{ !cancelled() }}
        run: bash mutants/run.sh
