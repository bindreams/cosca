name: CI

# THROWAWAY (tmp/377-narrow): mutant evidence for #377's tracer precondition checks. Do not merge.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_SETUID: "0"
  COSCA_TEST_CGROUP: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: Tracer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Build tests
        run: cargo nextest run --locked --no-run --lib --target ${{ matrix.target }} --profile ci
      - name: Run tracer tests
        timeout-minutes: 8
        run: exec cargo nextest run --locked --lib --no-fail-fast --target ${{ matrix.target }} --profile ci -E 'test(/^test_support::tracer::/)'
