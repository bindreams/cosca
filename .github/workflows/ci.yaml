name: CI

# THROWAWAY (tmp/377-narrow): mutant evidence for #377's tracer precondition checks. Do not merge.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_SETUID: "0"
  COSCA_TEST_CGROUP: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: Tracer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Build tests
        run: cargo nextest run --locked --no-run --lib --target ${{ matrix.target }} --profile ci
      - name: Diag under nextest
        timeout-minutes: 3
        run: cargo nextest run --locked --lib --target ${{ matrix.target }} --no-capture -E 'test(/diag_jobc/)'
      - name: Build plain cargo test
        run: cargo test --locked --no-run --lib --target ${{ matrix.target }}
      - name: Diag under plain cargo test
        timeout-minutes: 3
        shell: bash
        run: |
          set -uxo pipefail
          source .github/scripts/forward-signals.sh
          ps -o pid,ppid,pgid,sess,jobc,stat,comm -p $$ -p $PPID
          run_forwarding cargo test --locked --lib --target ${{ matrix.target }} -- diag_jobc --nocapture
