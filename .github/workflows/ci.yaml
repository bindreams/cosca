name: CI

# THROWAWAY (tmp/s4wedge-*): the SIGCONT re-stop tests, RED on the mutant, then GREEN.

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  restop:
    name: Restop (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo test --locked --lib --no-run
      - name: Restop tests
        timeout-minutes: 10
        run: >-
          cargo test --locked --lib -- --test-threads=1
          test_support::tracer::tracer_tests::s2_restops
          test_support::tracer::tracer_tests::s2_a_failed_restop
          test_support::tracer::tracer_tests::s4_restops
          test_support::tracer::tracer_tests::s4_a_failed_restop
          test_support::tracer::tracer_tests::s4_a_restop
