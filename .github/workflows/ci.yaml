# THROWAWAY probe for the forward.py macOS stall (run 37100927645). Not for merging.
name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  window:
    name: window (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Environment
        run: uname -a; sw_vers; which python3; python3 -VV
      - name: Deterministic window reproduction
        timeout-minutes: 15
        working-directory: .github/scripts
        run: python3 fwd_window.py 20
