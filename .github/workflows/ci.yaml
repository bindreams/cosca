name: CI

# Throwaway (#805): stresses one macOS tracer test. Not for merging.

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_ROOT: "0"
  NEXTEST_VERSION: "0.9.148"
  COSCA_TEST_UID_SWITCH: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "0"
  COSCA_TEST_SETUID: "0"
  COSCA_TEST_CGROUP: "0"
  COSCA_TEST_ELEVATION: "0"
  STRESS_TEST: "child::shared::shared_tests::traced::a_wait_on_a_child_whose_tracer_is_traced_watches_that_tracers_tracer"

jobs:
  stress:
    name: Stress (darwin/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Build tests
        run: cargo nextest run --locked --no-run --features tokio --target ${{ matrix.target }} --profile ci-tracer

      # The bound as it is on this branch.
      - name: Stress under the branch's bound
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          COSCA_TEST_TRACER: "1"
          COSCA_TEST_TRACER_CONSENT: "1"
          SKULD_LABELS: tracer
        run: >-
          cargo nextest run --locked --no-tests=fail --features tokio --target ${{ matrix.target }}
          --profile ci-tracer --no-fail-fast --stress-count 30
          --success-output final --failure-output final
          -E "binary(cosca) & test(=$STRESS_TEST)"

      # The same with a 60 s bound: the full duration of every iteration.
      - name: Stress under a 60 s bound
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          COSCA_TEST_TRACER: "1"
          COSCA_TEST_TRACER_CONSENT: "1"
          SKULD_LABELS: tracer
        run: >-
          cargo nextest run --locked --no-tests=fail --features tokio --target ${{ matrix.target }}
          --profile stress-long --no-fail-fast --stress-count 30
          --success-output final --failure-output final
          -E "binary(cosca) & test(=$STRESS_TEST)"
