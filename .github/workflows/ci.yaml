name: adv455j-probe
on:
  pull_request:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Versions
        run: sw_vers; uname -a; python3 --version
      - name: CHLD probe
        working-directory: .github/scripts/probe
        run: for _ in 1 2 3; do python3 chld.py; done
      - name: Injection probe (real kqueue)
        working-directory: .github/scripts
        run: |
          for m in none kq-pending-before-reg kq-drain-before-pending; do
            d="$RUNNER_TEMP/inj/$m"; mkdir -p "$d"; cp *.py "$d/"
            python3 probe/mutants.py "$m" "$d"
            for mode in before after; do
              for _ in 1 2 3 4 5; do echo "$m $(python3 probe/inject.py "$d" "$mode")"; done
            done
          done
      - name: HEAD suite, 3x full, 10x signal-sensitive
        working-directory: .github/scripts
        run: |
          set -u
          REPEAT=3 bash probe/run-mutants.sh none
          REPEAT=10 SUITES="forward_tests.Waiting forward_tests.Relay forward_tests.SpawnWindow forward_tests.KqueueWaiter" bash probe/run-mutants.sh none
      - name: Mutants, full suites (no -f)
        working-directory: .github/scripts
        run: |
          bash probe/run-mutants.sh kq-pending-before-reg kq-drain-before-pending kq-empty-pending kq-no-drain kq-dup-merge kq-ign-before-reg kq-oneshot kq-no-ignore kq-no-chld-kevent relay-after-reap block-after-popen no-disposition-reset unmask-first no-sigchld-reset chld-not-blocked blocking-waitpid fatal-relay-error relay-to-pid relay-as-is sigkill-relay no-setsid no-mask-reset
      - name: Mutants needing repeats (signal-sensitive classes x10)
        working-directory: .github/scripts
        run: |
          REPEAT=10 SUITES="forward_tests.Waiting forward_tests.Relay forward_tests.SpawnWindow" bash probe/run-mutants.sh always-sigwait kq-oneshot
