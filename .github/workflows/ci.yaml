name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let main / dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Every job here runs unprivileged unless it says otherwise, so the tests that only mean
  # something as root opt out (principles 9 and 10).
  COSCA_TEST_ROOT: "0"
  # One place for values several jobs share. `.config/nextest.toml` requires the same nextest.
  NEXTEST_VERSION: "0.9.137"
  # The tests the root lanes run: the modules gated on `COSCA_TEST_ROOT`.
  PRIVILEGE_TESTS: "test(/resolve_base_tests|exact_posix_tests|test_child/)"
  # System-affecting groups are off workflow-wide; the root lane opts back in.
  COSCA_TEST_NAMESPACES: "0"
  # The setuid group runs only where a step provisions a setuid-root helper and opts back in.
  COSCA_TEST_SETUID: "0"
  # The cgroup drop tests need a delegated cgroup: only the cgroup step below runs them.
  COSCA_TEST_CGROUP_DROP: "0"

jobs:
  lint:
    if: false
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # setup-rust so the cargo-fmt / cargo-clippy prek hooks (language = "system")
      # find a toolchain.
      # The targets are the ones check-disallowed-methods.sh lints its fixture for.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-pc-windows-msvc

      # tools/skuld-migrate and tools/no-libtest also run their own tests under nextest.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # prek.toml is the single source of truth for lint — the same checks run
      # locally as git hooks. prek-action runs `prek run --all-files`.
      - uses: j178/prek-action@v2

      - name: Test release helper scripts
        shell: bash
        run: bash .github/scripts/release-script-tests.sh

      - name: Test sccache fallback script
        shell: bash
        run: bash .github/scripts/enable-sccache-tests.sh

      - name: Test signal forwarding script
        shell: bash
        run: bash .github/scripts/forward-signals-tests.sh

      # Regression check for clippy.toml's disallowed-methods bans (see that file): lints
      # .github/fixtures/disallowed-methods, a standalone crate that calls every banned path,
      # against the real clippy.toml, and asserts the diagnostic actually fires for each —
      # structured JSON, not scraped text. Catches a renamed disallowed-methods key, a typo'd
      # path, or a dependency upgrade that silently moves a function out from under the ban.
      # `!cancelled()`: same override-success() rationale as the step below.
      - name: Check the disallowed-methods bans still fire
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/check-disallowed-methods.sh

      # The prek `cargo-clippy` hook above calls .github/scripts/clippy.sh with
      # neither --target nor --feature-powerset (host, no features) — this crate
      # declares no `default` feature, so the host (Linux) side of the
      # feature-gated tokio/pty/serde code paths (and any feature-gated dead
      # code among them) is never linted by the hook alone.
      #
      # Placed after the local-parity checks above, not right after checkout,
      # for the same reason as the test job's Clippy step below: a failure here
      # would otherwise skip `Test release helper scripts` and hide its result.
      # `!cancelled()`: same override-success() rationale as that step.
      - name: Clippy (feature powerset)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/clippy-powerset

      # `cfg(not(debug_assertions))` code (release-only branches and their tests) is compiled by no
      # debug build, so the step above never lints it, and neither do clippy.toml's bans. The
      # powerset action installed cargo-hack.
      - name: Clippy (feature powerset, release)
        if: ${{ !cancelled() }}
        shell: bash
        run: .github/scripts/clippy.sh --feature-powerset --release

  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exec: "exec "
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exec: "exec "
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            exec: "exec "
            # This is the one darwin lane that also runs the feature-powerset
            # Clippy step below; see there for why one arch stands in for both.
            lint: true
          - os: darwin
            arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
            exec: "exec "
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # This is the one Windows lane that also runs the feature-powerset
            # Clippy step below; see there for why one arch stands in for both.
            lint: true
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    # The TRACER test group attaches a tracer to the tests' own children; a CI runner is the
    # sandbox, so every step consents. Windows has no tracer tests.
    env:
      COSCA_TEST_TRACER: "1"
      COSCA_TEST_TRACER_CONSENT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          # see Clippy (feature powerset) step below for why only the
          # matrix.lint lanes get the component
          components: ${{ matrix.lint && 'clippy' || '' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Build D0 probes
        run: cargo nextest run --locked --no-run --target ${{ matrix.target }} --profile ci --test private_call_probe

      - name: Run D0 probes
        timeout-minutes: 8
        run: ${{ matrix.exec }}cargo nextest run --locked --target ${{ matrix.target }} --profile ci --test private_call_probe --no-capture

  # The unit tests that need root or a DAC-bypass capability (`PRIVILEGE_TESTS`). The `test` matrix
  # above is unprivileged and opts out of them (`COSCA_TEST_ROOT=0`). Each lane runs a nextest
  # archive in a container, so it needs no toolchain. Before nextest, `root-lane-check.sh` fails the
  # lane unless its EXPECT_* privilege state holds.
  #
  # What each lane adds:
  #   root:           the base case.
  #   unshare -r:     root in a fresh user namespace, which holds `CAP_DAC_READ_SEARCH`.
  #   DAC_READ_SEARCH: root with that capability added directly.
  #   foreign TMPDIR: an ambient `TMPDIR` the dropped identity cannot search.
  #   uid 1000:       not root, `CAP_DAC_OVERRIDE` ambient. The exec-child test runs (its
  #                   precondition is a DAC bypass, not uid 0), but a non-root `execve` regains
  #                   nothing, so only the root lanes catch a deleted `no_new_privs`.
  # Capability masks: `CAP_DAC_OVERRIDE` is 0x2, `CAP_DAC_READ_SEARCH` is 0x4.
  resolve_root_lanes:
    if: false
    name: Root lane (${{ matrix.lane }})
    runs-on: ubuntu-24.04 # matches the `ubuntu:24.04` run image's glibc
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: root
            docker_flags: ""
            prefix: ""
            expect_uid: "0"
            expect_capeff_has: "0x2"
            expect_capeff_lacks: "0x4"
            expect_capamb: "0x0"
          - lane: root, unshare -r
            docker_flags: "--cap-add SYS_ADMIN" # `unshare -r` needs it
            prefix: "unshare -r "
            expect_uid: "0"
            expect_capeff_has: "0x6"
            expect_capeff_lacks: "0x0"
            expect_capamb: "0x0"
            expect_userns: "1"
          - lane: root, DAC_READ_SEARCH
            docker_flags: "--cap-add DAC_READ_SEARCH"
            prefix: ""
            expect_uid: "0"
            expect_capeff_has: "0x6"
            expect_capeff_lacks: "0x0"
            expect_capamb: "0x0"
          - lane: root, foreign TMPDIR
            docker_flags: ""
            prefix: ""
            expect_uid: "0"
            expect_capeff_has: "0x2"
            expect_capeff_lacks: "0x4"
            expect_capamb: "0x0"
            foreign_tmpdir: "true"
          - lane: uid 1000, CAP_DAC_OVERRIDE ambient
            docker_flags: ""
            prefix: "setpriv --reuid 1000 --regid 1000 --clear-groups --inh-caps +dac_override --ambient-caps +dac_override "
            expect_uid: "1000"
            expect_capeff_has: "0x2"
            expect_capeff_lacks: "0x4"
            expect_capamb: "0x2"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Archive the privilege tests
        timeout-minutes: 10
        run: cargo nextest archive --locked --archive-file "$RUNNER_TEMP/root-lane.tar.zst"

      # The container is the sandbox, so consent is given here.
      # `exec` and `--init`: the runner signals only this shell, `docker run` forwards the signal to
      # the container's pid 1, and an init process passes it on to the lane's script.
      - name: Run lane
        timeout-minutes: 8
        run: |
          set -euxo pipefail
          exec docker run --rm --init --network none ${{ matrix.docker_flags }} \
            -v "$PWD":/repo:ro \
            -v "$RUNNER_TEMP":/artifacts:ro \
            -v "$(command -v cargo-nextest)":/usr/local/bin/cargo-nextest:ro \
            -e COSCA_TEST_ROOT=1 \
            -e COSCA_TEST_ROOT_CONSENT=1 \
            -e PRIVILEGE_TESTS \
            -e FOREIGN_TMPDIR="${{ matrix.foreign_tmpdir }}" \
            -e PREFIX="${{ matrix.prefix }}" \
            -e EXPECT_UID="${{ matrix.expect_uid }}" \
            -e EXPECT_CAPEFF_HAS="${{ matrix.expect_capeff_has }}" \
            -e EXPECT_CAPEFF_LACKS="${{ matrix.expect_capeff_lacks }}" \
            -e EXPECT_CAPAMB="${{ matrix.expect_capamb }}" \
            -e EXPECT_USERNS="${{ matrix.expect_userns }}" \
            ubuntu:24.04 \
            bash /repo/.github/scripts/root-lane.sh

      - name: Print the process table
        if: cancelled() || failure()
        timeout-minutes: 2
        run: ps -eo pid,ppid,pgid,stat,etime,args

  # Root on macOS, where a fixture drops by changing uid and re-execs a copy of the test binary.
  # No container on macOS runners, so this runs under `sudo`.
  resolve_root_lane_macos:
    if: false
    name: Root lane (macOS, sudo -E)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Set up setuid-root helper (macOS)
        run: |
          set -euxo pipefail
          BIN=$(cargo build --locked --bin cosca_testbin --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cosca_testbin") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -x "$BIN"
          HELPER="${RUNNER_TEMP}/cosca_testbin_setuid"
          cp "$BIN" "$HELPER"
          sudo chown root:wheel "$HELPER"
          sudo chmod 4755 "$HELPER"
          echo "COSCA_TEST_SETUID_HELPER=$HELPER" >> "$GITHUB_ENV"

      - name: Check the setuid lane (macOS)
        run: bash .github/scripts/setuid-lane-check.sh "$COSCA_TEST_SETUID_HELPER"

      - name: Build setuid tests (macOS)
        run: cargo nextest run --locked --no-run --features tokio --profile ci -E 'test(/setuid_/)'

      - name: Run setuid tests (macOS)
        timeout-minutes: 8
        env:
          COSCA_TEST_SETUID: "1"
          COSCA_TEST_SETUID_CONSENT: "1"
        run: exec cargo nextest run --locked --features tokio --profile ci -E 'test(/setuid_/)'

      - name: Archive the privilege tests
        timeout-minutes: 10
        run: cargo nextest archive --locked --archive-file "$RUNNER_TEMP/root-lane-macos.tar.zst"

      # Two directories:
      # - `TMPDIR`, root-owned 0755. The ambient `TMPDIR` must be searchable by uid 65534, which
      #   the runner user's own per-app `TMPDIR` is not. It is not writable by 65534 either, so a
      #   fixture that ignores its scratch directory fails.
      # - nextest's extraction directory, root-owned 0700. The test binary then sits somewhere uid
      #   65534 cannot enter, so a fixture passes only if the driver re-execs a copy of it.
      - name: Create root-owned scratch and extraction directories
        run: |
          set -euxo pipefail
          COSCA_ROOT_TMPDIR="$(sudo mktemp -d /tmp/cosca-root-scratch.XXXXXX)"
          sudo chown root:wheel "$COSCA_ROOT_TMPDIR"
          sudo chmod 0755 "$COSCA_ROOT_TMPDIR"
          COSCA_EXTRACT_DIR="$(sudo mktemp -d /tmp/cosca-root-extract.XXXXXX)"
          sudo chown root:wheel "$COSCA_EXTRACT_DIR"
          sudo chmod 0700 "$COSCA_EXTRACT_DIR"
          {
            echo "COSCA_EXTRACT_DIR=$COSCA_EXTRACT_DIR"
            echo "TMPDIR=$COSCA_ROOT_TMPDIR"
          } >> "$GITHUB_ENV"

      # `sudo -E` keeps `TMPDIR`; the runner is ephemeral and single-tenant, so consent is given
      # here. The lane fails unless it really is euid 0 and `TMPDIR` is root-owned.
      - name: Run root lane (macOS)
        timeout-minutes: 8
        env:
          COSCA_TEST_ROOT: "1"
          COSCA_TEST_ROOT_CONSENT: "1"
        run: |
          set -euxo pipefail
          exec sudo -E bash -euxc '
            test "$(id -u)" = 0
            test "$(stat -f %u "$TMPDIR")" = 0
            exec "$0" nextest run --archive-file "$1" --extract-to "$2" --workspace-remap "$PWD" --profile ci -E "$PRIVILEGE_TESTS"
          ' "$(command -v cargo-nextest)" "$RUNNER_TEMP/root-lane-macos.tar.zst" "$COSCA_EXTRACT_DIR"

      - name: Print the process table
        if: cancelled() || failure()
        timeout-minutes: 2
        run: ps -axo pid,ppid,pgid,stat,etime,command

  d0-kernels:
    name: D0 kernels (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Print the kernel
        run: uname -r

      - name: Build D0 probes
        run: cargo nextest run --locked --no-run --profile ci --test private_call_probe -E 'test(d0_l1_pidfs) | test(d0_env)'

      - name: Run D0 probes
        timeout-minutes: 8
        run: exec cargo nextest run --locked --profile ci --test private_call_probe -E 'test(d0_l1_pidfs) | test(d0_env)' --no-capture
