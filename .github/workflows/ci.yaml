name: CI

on:
  pull_request:

jobs:
  probe:
    name: adv455h probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe sigwait and forward.py
        timeout-minutes: 20
        shell: bash
        working-directory: .github/scripts
        run: python3 -u adv455h_probe4.py
