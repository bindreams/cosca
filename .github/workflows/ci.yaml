name: CI

# THROWAWAY (tmp/555-reaped-flake): only the darwin/arm64 repro of the #555 flake.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.146"
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_UID_SWITCH: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_SETUID: "0"
  COSCA_TEST_CGROUP: "0"

jobs:
  repro:
    name: Repro (darwin/arm64)
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build tests (tokio feature)
        run: cargo nextest run --locked --no-run --features tokio --target aarch64-apple-darwin
      - name: RED tests (expected to fail)
        continue-on-error: true
        timeout-minutes: 5
        run: cargo nextest run --locked --features tokio --target aarch64-apple-darwin --no-fail-fast --no-capture -E 'test(/tmp_red_/)'
      - name: Stress main's test shape (3000x)
        continue-on-error: true
        timeout-minutes: 20
        run: cargo nextest run --locked --features tokio --target aarch64-apple-darwin --no-fail-fast --stress-count 3000 -E 'test(/::tmp_original_wait_closes_the_untaken_stdin_first$/)'
      - name: Stress the fixed test (3000x)
        timeout-minutes: 20
        run: cargo nextest run --locked --features tokio --target aarch64-apple-darwin --no-fail-fast --stress-count 3000 -E 'test(/::wait_closes_the_untaken_stdin_first$/)'
