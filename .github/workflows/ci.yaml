name: CI

# THROWAWAY (tmp/s4wedge-a1): the never-started-thread test on the "no exemption" mutant.

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  mutant:
    name: Mutant (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo test --locked --lib --no-run
      - name: Tests
        timeout-minutes: 5
        run: >-
          cargo test --locked --lib -- --test-threads=1
          test_support::tracer::sys::sys_tests
          test_support::tracer::tracer_tests::a_stop_with_a_never_started_thread_settles
