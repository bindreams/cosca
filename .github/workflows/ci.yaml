# THROWAWAY probe for the forward.py macOS stall (run 37100927645). Not for merging.
name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    name: probe (${{ matrix.runner }}, jitter ${{ matrix.jitter }}us)
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
        jitter: [0, 20]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Environment
        run: uname -a; sw_vers; which python3; python3 -VV
      - name: Probe
        timeout-minutes: 38
        working-directory: .github/scripts
        env:
          PROBE_OUT: ${{ runner.temp }}/probe
          PROBE_JITTER_US: ${{ matrix.jitter }}
          PROBE_OBSERVE: "60"
        run: |
          mkdir -p "$PROBE_OUT"
          python3 fwd_probe.py ${{ matrix.jitter == 0 && 8000 || 4000 }} j${{ matrix.jitter }}
      - name: Summary
        if: always()
        run: python3 .github/scripts/fwd_probe_summary.py "${{ runner.temp }}/probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-${{ matrix.runner }}-j${{ matrix.jitter }}
          path: ${{ runner.temp }}/probe
  window:
    name: window (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Environment
        run: uname -a; sw_vers; which python3; python3 -VV
      - name: Deterministic window reproduction
        timeout-minutes: 15
        working-directory: .github/scripts
        run: python3 fwd_window.py 20
