name: CI

# THROWAWAY (tmp/377-narrow): mutant evidence for #377's tracer precondition checks. Do not merge.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_SETUID: "0"
  COSCA_TEST_CGROUP: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: Tracer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Build tests
        run: cargo nextest run --locked --no-run --lib --target ${{ matrix.target }} --profile ci
      - name: Unmutated tracer tests
        timeout-minutes: 8
        run: cargo nextest run --locked --lib --no-fail-fast --target ${{ matrix.target }} --profile ci -E 'test(/^test_support::tracer::/)'
      - name: Mutants (each must fail its named test)
        timeout-minutes: 8
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for m in M1 M2 M3 M4 M5 M6 M7 M8; do
            case $m in
              M1) t=a_blocked_signal_fails_the_precondition ;;
              M2) t=an_ignored_signal_fails_the_precondition ;;
              M3) t=a_missing_handler_fails_the_precondition ;;
              M4) t=an_orphaned_group_fails_the_precondition_for_a_job_control_stop ;;
              M5) t=an_orphaned_group_does_not_matter_for_other_signals ;;
              M6 | M7) t=the_tracees_meet_the_preconditions ;;
              M8) t=a_shared_group_fails_the_precondition_for_a_job_control_stop ;;
            esac
            if COSCA_MUT=$m cargo nextest run --locked --lib --no-fail-fast --target ${{ matrix.target }} --profile ci -E "test(=test_support::tracer::tracer_tests::$t)" > "mut-$m.log" 2>&1; then
              echo "MUTANT $m SURVIVED ($t passed)"; status=1
            else
              echo "MUTANT $m KILLED by $t:"; grep -E "Summary|panicked at|assertion|no failure" "mut-$m.log" | head -4
            fi
          done
          exit "$status"
