name: CI

# THROWAWAY (PR #377 review): does s4_passes_a_caught_stop_signal_through depend on the SIGTSTP
# handler finishing before the test's SIGSTOP?
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"
  T: test_support::tracer::tracer_tests::s4_passes_a_caught_stop_signal_through

jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: OS version
        run: sw_vers
      - name: Build
        run: cargo test --locked --lib --no-run
      - name: Amplified (handler still running at the SIGSTOP), 40 runs
        if: ${{ !cancelled() }}
        env:
          COSCA_UH_SLOW_TSTP: "1"
        run: |
          pass=0; fail=0
          for i in $(seq 1 40); do
            if cargo test --locked --lib "$T" -- --exact > "$RUNNER_TEMP/amp-$i.log" 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1)); echo "=== amplified run $i FAILED"; grep -E "panicked|assert|handler" "$RUNNER_TEMP/amp-$i.log" | head -5
            fi
          done
          echo "AMPLIFIED pass=$pass fail=$fail"
      - name: Unmodified, 300 runs
        if: ${{ !cancelled() }}
        run: |
          pass=0; fail=0
          for i in $(seq 1 300); do
            if cargo test --locked --lib "$T" -- --exact > "$RUNNER_TEMP/plain-$i.log" 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1)); echo "=== plain run $i FAILED"; grep -E "panicked|assert|handler" "$RUNNER_TEMP/plain-$i.log" | head -5
            fi
          done
          echo "PLAIN pass=$pass fail=$fail"
