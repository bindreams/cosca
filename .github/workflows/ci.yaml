# THROWAWAY: replaced by a research probe on a tmp branch; never merge.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  pidseq-probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: ETW manifest
        run: ./tmp-probe/probe.ps1 manifest
      - name: ETW ground truth
        run: ./tmp-probe/probe.ps1 etw
      - name: pid vs sequence ordering
        run: ./tmp-probe/probe.ps1 order
