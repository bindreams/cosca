name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let main / dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Every job here runs unprivileged unless it says otherwise, so the tests that only mean
  # something as root opt out (principles 9 and 10).
  COSCA_TEST_ROOT: "0"
  # One place for values several jobs share. `.config/nextest.toml` requires the same nextest.
  NEXTEST_VERSION: "0.9.137"
  # The tests the root lanes run: the modules gated on `COSCA_TEST_ROOT`.
  PRIVILEGE_TESTS: "test(/resolve_base_tests|exact_posix_tests|test_child/)"
  # System-affecting groups are off workflow-wide; the root lane opts back in.
  COSCA_TEST_NAMESPACES: "0"
  # The cgroup tests need a delegated cgroup; only the cgroup lane below runs them.
  COSCA_TEST_CGROUP: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # setup-rust so the cargo-fmt / cargo-clippy prek hooks (language = "system")
      # find a toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # tools/skuld-migrate and tools/no-libtest also run their own tests under nextest.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # prek.toml is the single source of truth for lint — the same checks run
      # locally as git hooks. prek-action runs `prek run --all-files`.
      - uses: j178/prek-action@v2

      - name: Test release helper scripts
        shell: bash
        run: bash .github/scripts/release-script-tests.sh

      # Regression check for clippy.toml's disallowed-methods bans (see that file): lints
      # .github/fixtures/disallowed-methods, a standalone crate that calls every banned path,
      # against the real clippy.toml, and asserts the diagnostic actually fires for each —
      # structured JSON, not scraped text. Catches a renamed disallowed-methods key, a typo'd
      # path, or a dependency upgrade that silently moves a function out from under the ban.
      # `!cancelled()`: same override-success() rationale as the step below.
      - name: Check the disallowed-methods bans still fire
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/check-disallowed-methods.sh

      # The prek `cargo-clippy` hook above calls .github/scripts/clippy.sh with
      # neither --target nor --feature-powerset (host, no features) — this crate
      # declares no `default` feature, so the host (Linux) side of the
      # feature-gated tokio/pty/serde code paths (and any feature-gated dead
      # code among them) is never linted by the hook alone.
      #
      # Placed after the local-parity checks above, not right after checkout,
      # for the same reason as the test job's Clippy step below: a failure here
      # would otherwise skip `Test release helper scripts` and hide its result.
      # `!cancelled()`: same override-success() rationale as that step.
      - name: Clippy (feature powerset)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/clippy-powerset

      # `cfg(not(debug_assertions))` code (release-only branches and their tests) is compiled by no
      # debug build, so the step above never lints it, and neither do clippy.toml's bans. The
      # powerset action installed cargo-hack.
      - name: Clippy (feature powerset, release)
        if: ${{ !cancelled() }}
        shell: bash
        run: .github/scripts/clippy.sh --feature-powerset --release

  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            # This is the one darwin lane that also runs the feature-powerset
            # Clippy step below; see there for why one arch stands in for both.
            lint: true
          - os: darwin
            arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # This is the one Windows lane that also runs the feature-powerset
            # Clippy step below; see there for why one arch stands in for both.
            lint: true
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          # see Clippy (feature powerset) step below for why only the
          # matrix.lint lanes get the component
          components: ${{ matrix.lint && 'clippy' || '' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cargo nextest run --locked --target ${{ matrix.target }} --profile ci

      # The one Windows test that maps a drive letter (`DefineDosDeviceW`, visible to the whole
      # logon session) is `#[ignore]`d everywhere else. This step opts in to exactly that test.
      - name: Run the drive-mapping test (Windows)
        if: matrix.os == 'windows'
        run: >-
          cargo nextest run --locked --target ${{ matrix.target }} --profile ci
          --test windows_process_cwd --run-ignored all
          -E 'test(=a_drive_relative_current_dir_takes_the_drives_own_directory_as_win32_does)'

      # `pty` is an additive feature flag; exercise the feature-gated code paths.
      - name: Run tests (pty feature)
        run: cargo nextest run --locked --features pty --target ${{ matrix.target }} --profile ci

      - name: Run tests (tokio feature)
        run: cargo nextest run --locked --features tokio --target ${{ matrix.target }} --profile ci

      # `serde` is an additive feature flag; exercise the persisted-identity wire format.
      - name: Run tests (serde feature)
        run: cargo nextest run --locked --features serde --target ${{ matrix.target }} --profile ci

      # nextest does not run doctests (https://github.com/nextest-rs/nextest/issues/16); this is
      # the only step in this job that still uses plain `cargo test`. cosca has no doctests today.
      - name: Run doctests
        run: cargo test --locked --doc --all-features --target ${{ matrix.target }}

      - name: Check rustdoc
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked --target "$TARGET"

      - name: Assert the package excludes test-only paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Write outside the workspace. A listing file created in the package
          # root becomes an uncommitted, non-excluded file that cargo sees as a
          # dirty worktree — the guard would abort before ever running.
          LIST="${RUNNER_TEMP}/pkg-list.txt"
          cargo package --list --locked --target "$TARGET" > "$LIST"

          set +e
          grep -qE '^(testbin/|tests/|\.github/|\.claude/|\.config/|prek\.toml$)' "$LIST"
          grep_status=$?
          set -e

          case "$grep_status" in
            0)
              echo "::error::Excluded paths leaked into the package:"
              grep -E '^(testbin/|tests/|\.github/|\.claude/|\.config/|prek\.toml$)' "$LIST"
              exit 1
              ;;
            1) echo "no excluded paths in the package" ;;
            *)
              echo "::error::grep errored (exit $grep_status); exclusion unverified"
              exit 1
              ;;
          esac

      # Release lane (debug_assertions off): exercises the calm-release arm of the
      # should_panic oracles in the macOS-gated kinfo_tests.rs, and the Linux cgroup tests of what
      # release builds do where debug builds assert a broken precondition instead.
      - name: Unit tests (release — debug_assertions off)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        run: cargo nextest run --locked --release --lib --target ${{ matrix.target }} --profile ci

      # The same lane with `tokio`: `tokio::wait_tests` pins `arm_at`'s calm-release arm (a deadline
      # inside tokio's timer margin waits unbounded where debug builds assert).
      - name: Unit tests (release — debug_assertions off, tokio feature)
        if: matrix.os == 'darwin' || matrix.os == 'linux'
        run: cargo nextest run --locked --release --lib --features tokio --target ${{ matrix.target }} --profile ci

      # `#[cfg(windows)]` code (including feature-gated code, e.g. tokio's raw
      # backend) and `cfg(target_os = "macos")` code are otherwise never
      # linted: the `lint` job only runs on ubuntu-latest, so clippy never
      # type-checks either against a Windows or macOS target.
      #
      # --feature-powerset, not --all-features: this crate has real dead_code
      # gaps that only a default-features-only build exposes, which
      # --all-features alone never catches.
      #
      # Placed after the test steps above (including the darwin and Linux release
      # lane just above), not right after Build: a clippy failure there would
      # skip every later step (their implicit `if: success()`), hiding test
      # results.
      #
      # `!cancelled()` is the one step in this job that overrides that implicit
      # `success()`: it makes this step run even after an earlier step in the
      # job has failed, so the lint result is always reported instead of being
      # hidden behind an earlier failure.
      #
      # Runs once per OS (windows/amd64, darwin/arm64), not once per arch
      # (matrix.lint is set on exactly these two entries): nothing in this
      # crate's Windows or macOS code is `cfg(target_arch = ...)`-gated
      # (checked: no such attribute exists in the tree), so within each OS the
      # two arches type-check and lint identically. Linting every arch would
      # double the Windows and macOS runner-minutes spent on lint for no
      # additional coverage.
      - name: Clippy (feature powerset)
        if: ${{ !cancelled() && matrix.lint }}
        uses: ./.github/actions/clippy-powerset
        with:
          target: ${{ matrix.target }}

      # Live cgroup v2 containment tests belong to the CGROUP group: on unless
      # COSCA_TEST_CGROUP=0 (this workflow's default), and, enabled, they need
      # COSCA_TEST_CGROUP_CONSENT=1 and fail without it. They need a cgroup the supervisor may
      # create child cgroups under. We make a fresh leaf directly under the unified root cgroup:
      # its `cgroup.subtree_control` is empty, so the v2 "no internal processes"
      # rule does not apply and a cgroup may hold BOTH the test process and a child
      # leaf. We move our shell into it and run only the cgroup-named tests there
      # (as root, single-threaded) — across the `spawn_io` integration binary, the
      # `--lib` unit-test binary (which carries the white-box CgroupLeaf::wait_drained
      # coverage in src/containment/cgroup_tests.rs, and with `tokio` the async spawn's
      # post-fork failure path), and `tokio_io`. `--run-ignored all` is for the one test that
      # needs `unshare(CLONE_FILES)`, which container seccomp profiles refuse. The tests assert
      # CgroupV2/build a real leaf and FAIL LOUDLY if it is unusable — never a silent skip.
      #
      # Also selected by exact name: the two `graceful_tree_members_remain_still_reaps_an_already_exited_root`
      # tests, whose `MembersRemain` branch only runs against a real cgroup v2 here.
      #
      # The unprivileged runner user builds the archive; only running it needs root. `sudo`'s
      # `secure_path` drops `~/.cargo/bin`, so `cargo-nextest`'s resolved path and the archive are
      # passed in as positional arguments rather than looked up again inside the root shell.
      - name: Run cgroup v2 containment tests (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          cargo nextest archive --locked --features pty,tokio --target ${{ matrix.target }} --archive-file "$RUNNER_TEMP/cgroup.tar.zst"
          sudo bash -euxc '
            CG=/sys/fs/cgroup/cosca-ci
            mkdir -p "$CG"
            echo $$ > "$CG/cgroup.procs"
            # The cgroup tests: a delegated cgroup on a throwaway runner, so consent is given.
            export COSCA_TEST_CGROUP=1 COSCA_TEST_CGROUP_CONSENT=1
            # Namespace tests: root here, on a throwaway runner, so consent is given.
            export COSCA_TEST_NAMESPACES=1 COSCA_TEST_NAMESPACES_CONSENT=1
            exec "$0" nextest run --archive-file "$1" --workspace-remap "$PWD" --profile ci --no-capture --run-ignored all -E "(((binary(cosca) | binary(spawn_io) | binary(tokio_io)) & (test(/cgroup/) | test(=child::graceful::graceful_tests::graceful_tree_members_remain_still_reaps_an_already_exited_root) | test(=tokio::child::graceful::graceful_tests::async_graceful_tree_members_remain_still_reaps_an_already_exited_root))) | (binary(cosca) & test(/namespaces_/)))"
          ' "$(command -v cargo-nextest)" "$RUNNER_TEMP/cgroup.tar.zst"

      # Live setuid-root process-group teardown test (issue #61) is `#[ignore]`d by default
      # (see tests/group_teardown_setuid.rs's module docs) — an ordinary `cargo nextest run`
      # anywhere, including the steps above, counts it as `skipped`, never runs it to a vacuous
      # `ok`. This is the one step that opts in, via `--run-ignored only`, after provisioning a
      # COPY of cosca_testbin that is genuinely setuid-root (owned by root, mode u+s) so the spawned
      # helper process can call setuid(0) itself and become truly unsignalable by this job's
      # ordinary unprivileged user — proving #61's fix against a REAL mixed process group
      # (one signalable member, one genuinely not), not a synthetic one. Only preparing the
      # helper copy needs root; the test itself runs as the normal unprivileged runner user,
      # no sudo. Once opted in, an unset/unusable helper FAILS LOUDLY (wrong owner/mode, or a
      # nosuid mount) — never a silent skip.
      - name: Set up setuid-root helper (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          BIN=$(cargo build --locked --target ${{ matrix.target }} --bin cosca_testbin --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cosca_testbin") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -x "$BIN"
          HELPER="${RUNNER_TEMP}/cosca_testbin_setuid"
          cp "$BIN" "$HELPER"
          sudo chown root:root "$HELPER"
          sudo chmod 4755 "$HELPER"
          echo "COSCA_TEST_SETUID_HELPER=$HELPER" >> "$GITHUB_ENV"

      - name: Run setuid-root process-group teardown test (Linux)
        if: matrix.os == 'linux'
        run: cargo nextest run --locked --target ${{ matrix.target }} --test group_teardown_setuid --run-ignored only --profile ci

      # The same test started as root re-executes itself as uid 65534 (see the test file's "Running
      # as root" docs), so the test binary, the `cosca_testbin` path compiled into it, and the
      # helper must all be reachable by that uid: every directory above the checkout is made
      # traversable and `target` readable. `sudo -E` keeps COSCA_TEST_SETUID_HELPER. The binary is
      # run directly because nextest archives extract into a root-only tempdir; libtest exits 0
      # when a filter matches nothing, so the log must show the test passing.
      - name: Run setuid-root process-group teardown test as root (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          BIN=$(cargo test --locked --target ${{ matrix.target }} --test group_teardown_setuid --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "group_teardown_setuid") | .executable' \
            | grep -v '^null$' | grep . | head -n1)
          test -x "$BIN"
          chmod -R a+rX "$PWD/target"
          d="$PWD"
          while [ "$d" != / ]; do sudo chmod a+x "$d"; d=$(dirname "$d"); done
          sudo -E "$BIN" --ignored --test-threads=1 --nocapture > "$RUNNER_TEMP/setuid-root.log" 2>&1 || { cat "$RUNNER_TEMP/setuid-root.log"; exit 1; }
          cat "$RUNNER_TEMP/setuid-root.log"
          grep -q '^test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/setuid-root.log"

  # The unit tests that need root or a DAC-bypass capability (`PRIVILEGE_TESTS`). The `test` matrix
  # above is unprivileged and opts out of them (`COSCA_TEST_ROOT=0`). Each lane runs a nextest
  # archive in a container, so it needs no toolchain. Before nextest, `root-lane-check.sh` fails the
  # lane unless its EXPECT_* privilege state holds.
  #
  # What each lane adds:
  #   root:           the base case.
  #   unshare -r:     root in a fresh user namespace, which holds `CAP_DAC_READ_SEARCH`.
  #   DAC_READ_SEARCH: root with that capability added directly.
  #   foreign TMPDIR: an ambient `TMPDIR` the dropped identity cannot search.
  #   uid 1000:       not root, `CAP_DAC_OVERRIDE` ambient. The exec-child test runs (its
  #                   precondition is a DAC bypass, not uid 0), but a non-root `execve` regains
  #                   nothing, so only the root lanes catch a deleted `no_new_privs`.
  # Capability masks: `CAP_DAC_OVERRIDE` is 0x2, `CAP_DAC_READ_SEARCH` is 0x4.
  resolve_root_lanes:
    name: Root lane (${{ matrix.lane }})
    runs-on: ubuntu-24.04 # matches the `ubuntu:24.04` run image's glibc
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: root
            docker_flags: ""
            prefix: ""
            expect_uid: "0"
            expect_capeff_has: "0x2"
            expect_capeff_lacks: "0x4"
            expect_capamb: "0x0"
          - lane: root, unshare -r
            docker_flags: "--cap-add SYS_ADMIN" # `unshare -r` needs it
            prefix: "unshare -r "
            expect_uid: "0"
            expect_capeff_has: "0x6"
            expect_capeff_lacks: "0x0"
            expect_capamb: "0x0"
            expect_userns: "1"
          - lane: root, DAC_READ_SEARCH
            docker_flags: "--cap-add DAC_READ_SEARCH"
            prefix: ""
            expect_uid: "0"
            expect_capeff_has: "0x6"
            expect_capeff_lacks: "0x0"
            expect_capamb: "0x0"
          - lane: root, foreign TMPDIR
            docker_flags: ""
            prefix: ""
            expect_uid: "0"
            expect_capeff_has: "0x2"
            expect_capeff_lacks: "0x4"
            expect_capamb: "0x0"
            foreign_tmpdir: "true"
          - lane: uid 1000, CAP_DAC_OVERRIDE ambient
            docker_flags: ""
            prefix: "setpriv --reuid 1000 --regid 1000 --clear-groups --inh-caps +dac_override --ambient-caps +dac_override "
            expect_uid: "1000"
            expect_capeff_has: "0x2"
            expect_capeff_lacks: "0x4"
            expect_capamb: "0x2"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Archive the privilege tests
        run: cargo nextest archive --locked --archive-file "$RUNNER_TEMP/root-lane.tar.zst"

      # The container is the sandbox, so consent is given here.
      - name: Run lane
        run: |
          set -euxo pipefail
          docker run --rm --network none ${{ matrix.docker_flags }} \
            -v "$PWD":/repo:ro \
            -v "$RUNNER_TEMP":/artifacts:ro \
            -v "$(command -v cargo-nextest)":/usr/local/bin/cargo-nextest:ro \
            -e COSCA_TEST_ROOT=1 \
            -e COSCA_TEST_ROOT_CONSENT=1 \
            -e PRIVILEGE_TESTS \
            -e FOREIGN_TMPDIR="${{ matrix.foreign_tmpdir }}" \
            -e PREFIX="${{ matrix.prefix }}" \
            -e EXPECT_UID="${{ matrix.expect_uid }}" \
            -e EXPECT_CAPEFF_HAS="${{ matrix.expect_capeff_has }}" \
            -e EXPECT_CAPEFF_LACKS="${{ matrix.expect_capeff_lacks }}" \
            -e EXPECT_CAPAMB="${{ matrix.expect_capamb }}" \
            -e EXPECT_USERNS="${{ matrix.expect_userns }}" \
            ubuntu:24.04 \
            bash /repo/.github/scripts/root-lane.sh

  # Root on macOS, where a fixture drops by changing uid and re-execs a copy of the test binary.
  # No container on macOS runners, so this runs under `sudo`.
  resolve_root_lane_macos:
    name: Root lane (macOS, sudo -E)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Archive the privilege tests
        run: cargo nextest archive --locked --archive-file "$RUNNER_TEMP/root-lane-macos.tar.zst"

      # Two directories:
      # - `TMPDIR`, root-owned 0755. The ambient `TMPDIR` must be searchable by uid 65534, which
      #   the runner user's own per-app `TMPDIR` is not. It is not writable by 65534 either, so a
      #   fixture that ignores its scratch directory fails.
      # - nextest's extraction directory, root-owned 0700. The test binary then sits somewhere uid
      #   65534 cannot enter, so a fixture passes only if the driver re-execs a copy of it.
      - name: Create root-owned scratch and extraction directories
        run: |
          set -euxo pipefail
          COSCA_ROOT_TMPDIR="$(sudo mktemp -d /tmp/cosca-root-scratch.XXXXXX)"
          sudo chown root:wheel "$COSCA_ROOT_TMPDIR"
          sudo chmod 0755 "$COSCA_ROOT_TMPDIR"
          COSCA_EXTRACT_DIR="$(sudo mktemp -d /tmp/cosca-root-extract.XXXXXX)"
          sudo chown root:wheel "$COSCA_EXTRACT_DIR"
          sudo chmod 0700 "$COSCA_EXTRACT_DIR"
          {
            echo "COSCA_EXTRACT_DIR=$COSCA_EXTRACT_DIR"
            echo "TMPDIR=$COSCA_ROOT_TMPDIR"
          } >> "$GITHUB_ENV"

      # `sudo -E` keeps `TMPDIR`; the runner is ephemeral and single-tenant, so consent is given
      # here. The lane fails unless it really is euid 0 and `TMPDIR` is root-owned.
      - name: Run root lane (macOS)
        env:
          COSCA_TEST_ROOT: "1"
          COSCA_TEST_ROOT_CONSENT: "1"
        run: |
          set -euxo pipefail
          sudo -E bash -euxc '
            test "$(id -u)" = 0
            test "$(stat -f %u "$TMPDIR")" = 0
            exec "$0" nextest run --archive-file "$1" --extract-to "$2" --workspace-remap "$PWD" --profile ci -E "$PRIVILEGE_TESTS"
          ' "$(command -v cargo-nextest)" "$RUNNER_TEMP/root-lane-macos.tar.zst" "$COSCA_EXTRACT_DIR"
