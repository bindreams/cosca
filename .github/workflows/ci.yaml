name: CI

# THROWAWAY (#346 adversarial review): tracer tests, mutants and a probe on both darwin lanes.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  NEXTEST_VERSION: "0.9.137"
  COSCA_TEST_ROOT: "0"
  COSCA_TEST_NAMESPACES: "0"
  COSCA_TEST_TRACER: "1"
  COSCA_TEST_TRACER_CONSENT: "1"

jobs:
  tracer:
    name: Tracer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: OS version
        run: sw_vers
      - name: Probes
        timeout-minutes: 30
        run: bash adv346/run.sh
