name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
jobs:
  mutants:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
      - name: Baseline (must be green)
        shell: bash
        run: cargo test --locked --features tokio --lib -- wait:: containment::windows child::spawn::windows_raw child::lifecycle tokio::wait
      - name: Mutants
        shell: bash
        run: python .github/mutants.py .github/mutants.json
