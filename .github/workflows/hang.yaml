name: Hang hunt
on: pull_request
jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {runner: macos-15, target: x86_64-apple-darwin, tag: amd64}
          - {runner: macos-latest, target: aarch64-apple-darwin, tag: arm64}
        variant: [fix, mutant]
        include:
          - {variant: fix, load: "2", n: 8}
          - {variant: mutant, load: "2", n: 4}
    name: ${{ matrix.arch.tag }}-${{ matrix.variant }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 90
    env:
      COSCA_TEST_TRACER: "1"
      COSCA_TEST_TRACER_CONSENT: "1"
      COSCA_TEST_ROOT: "0"
      COSCA_TEST_NAMESPACES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.arch.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Mutate (skip the thread-settling check)
        if: matrix.variant == 'mutant'
        run: |
          python3 - <<'PY'
          p='src/test_support/tracer/sys.rs'
          s=open(p).read()
          a="        Ok(true) => Ok(Stop::Stopped(info.si_status)),"
          assert a in s
          s=s.replace("    match threads_blocked(pid) {","    if true { return Ok(Stop::Stopped(info.si_status)); }\n    match threads_blocked(pid) {")
          open(p,'w').write(s)
          PY
          git diff --stat
      - name: Loop
        run: LOAD=${{ matrix.load }} STRESS=50 .github/scripts/hangloop.sh ${{ matrix.n }} "" 'test(/shared_tests::tracer::macos/)' 600
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch.tag }}-${{ matrix.variant }}
          path: logs
