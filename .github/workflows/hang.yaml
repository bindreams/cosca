name: Hang hunt
on: pull_request
jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {runner: macos-15, target: x86_64-apple-darwin, tag: amd64}
          - {runner: macos-latest, target: aarch64-apple-darwin, tag: arm64}
        variant: [m2-attachexc-no-exit-check]
        include:
          - {variant: fix, n: 8, stress: 50}
          - {variant: fix-widened, n: 4, stress: 10}
          - {variant: m1-attachexc, n: 1, stress: 3}
          - {variant: m2-attachexc-no-exit-check, n: 1, stress: 3}
    name: ${{ matrix.arch.tag }}-${{ matrix.variant }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 90
    env:
      COSCA_TEST_TRACER: "1"
      COSCA_TEST_TRACER_CONSENT: "1"
      COSCA_TEST_ROOT: "0"
      COSCA_TEST_NAMESPACES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.arch.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Mutate
        run: |
          python3 - <<'PY'
          v="${{ matrix.variant }}"
          def edit(p, old, new):
              x=open(p).read()
              assert old in x, (p, old)
              open(p,'w').write(x.replace(old,new))
          if v.startswith("m"):
              edit('src/test_support/tracer/sys.rs',"const ATTACH: libc::c_int = libc::PT_ATTACH;","const ATTACH: libc::c_int = libc::PT_ATTACHEXC;")
          if v.startswith("m2"):
              edit('src/test_support/tracer.rs',"if exited.si_pid != 0","if false && exited.si_pid != 0")
          if v != "fix":
              a='        step("attach and settle");'
              edit('src/child/shared_tests/tracer.rs',a,'        std::thread::sleep(Duration::from_millis(300));\n'+a)
          PY
          git diff --stat
      - name: Loop
        run: STRESS=${{ matrix.stress }} bash .github/scripts/hangloop.sh ${{ matrix.n }} "" 'test(/shared_tests::tracer::macos/)' 600
        continue-on-error: ${{ startsWith(matrix.variant, 'm') }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch.tag }}-${{ matrix.variant }}
          path: logs
