name: Hang hunt
on: pull_request
jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: amd64-reap, runner: macos-15, target: x86_64-apple-darwin, n: 8}
          - {name: arm64-reap, runner: macos-latest, target: aarch64-apple-darwin, n: 8}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      COSCA_TEST_TRACER: "1"
      COSCA_TEST_TRACER_CONSENT: "1"
      COSCA_TEST_ROOT: "0"
      COSCA_TEST_NAMESPACES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137
      - name: Loop
        run: STRESS=40 .github/scripts/hangloop.sh "${{ matrix.n }}" "" 'test(/shared_tests::tracer::macos/)' 600
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: logs
