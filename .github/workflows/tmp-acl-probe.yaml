name: tmp-acl-probe
on:
  pull_request:
env:
  NEXTEST_VERSION: "0.9.146"
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build tests
        run: cargo nextest run --locked --no-run --target x86_64-pc-windows-msvc --profile ci
      - name: Native view of the environment and token, from pwsh
        run: |
          cmd /c set | Sort-Object > "$env:RUNNER_TEMP/env-pwsh.txt"
          whoami /priv > "$env:RUNNER_TEMP/priv-pwsh.txt"
          whoami /groups > "$env:RUNNER_TEMP/groups-pwsh.txt"
      - name: Native view of the environment and token, from bash
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cmd //c set | sort > "$RUNNER_TEMP/env-bash.txt"
          /c/Windows/System32/whoami.exe /priv > "$RUNNER_TEMP/priv-bash.txt"
          /c/Windows/System32/whoami.exe /groups > "$RUNNER_TEMP/groups-bash.txt"
      - name: Diff of the native views
        continue-on-error: true
        run: |
          foreach ($k in 'env','priv','groups') {
            "=== $($k): pwsh vs bash ==="
            Compare-Object (Get-Content "$($env:RUNNER_TEMP)/$($k)-pwsh.txt") (Get-Content "$($env:RUNNER_TEMP)/$($k)-bash.txt") | Format-Table -AutoSize -Wrap | Out-String -Width 300
          }
      - name: The ACL tests from pwsh
        continue-on-error: true
        run: cargo nextest run --locked --target x86_64-pc-windows-msvc --profile ci --no-fail-fast -E 'test(/an_undeterminable_windows_acl/)'
      - name: The ACL tests from bash
        shell: bash
        continue-on-error: true
        run: cargo nextest run --locked --target x86_64-pc-windows-msvc --profile ci --no-fail-fast -E 'test(/an_undeterminable_windows_acl/)'
      - name: The ACL tests from bash, with pwsh's own environment block
        shell: bash
        continue-on-error: true
        run: |
          # Re-launch through pwsh so the test sees what a pwsh step's child sees, but under bash's parent.
          pwsh -NoProfile -Command "cargo nextest run --locked --target x86_64-pc-windows-msvc --profile ci --no-fail-fast -E 'test(/an_undeterminable_windows_acl/)'"
