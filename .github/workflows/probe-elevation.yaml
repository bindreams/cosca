name: probe-elevation
on:
  pull_request:
jobs:
  win:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Facts
        shell: pwsh
        continue-on-error: true
        run: |
          whoami
          whoami /groups
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v ConsentPromptBehaviorAdmin
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v PromptOnSecureDesktop
          reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v FilterAdministratorToken
      - name: Start-Process RunAs
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c','echo hi > C:\Windows\Temp\probe-runas.txt' -Verb RunAs -Wait -PassThru
          "exit: $($p.ExitCode)"
          Get-Content C:\Windows\Temp\probe-runas.txt
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Elevation tests as they stand
        shell: pwsh
        continue-on-error: true
        env:
          COSCA_TEST_ELEVATION: "1"
          COSCA_TEST_ELEVATION_MARKER_DIR: C:\Windows\Temp
        run: cargo nextest run --locked --target ${{ matrix.target }} --features tokio --test elevation --no-fail-fast --no-capture
  lin:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Facts
        continue-on-error: true
        run: |
          id; systemd --version | head -2; command -v sudo doas pkexec run0 polkitd || true
          sudo -n true && echo "sudo -n ok"; ls /etc/sudoers.d; sudo cat /etc/sudoers.d/* | head
          ls /usr/lib/polkit-1 /usr/libexec/polkitd 2>&1 | head
          dpkg -l | grep -i polkit || true
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Elevation tests as they stand
        continue-on-error: true
        env:
          COSCA_TEST_ELEVATION: "1"
          COSCA_TEST_ELEVATION_PASSWORD: "x"
        run: cargo nextest run --locked --features tokio --test elevation --no-fail-fast --no-capture
  lin26:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Facts
        continue-on-error: true
        run: |
          id; systemd --version | head -1; command -v sudo doas pkexec run0 polkitd || true
          sudo -n true && echo "sudo-n-ok"
          ls /usr/lib/polkit-1 /usr/libexec/polkitd 2>&1 | head
          dpkg -l | grep -i polkit || true
          sudo cat /etc/sudoers.d/* | head -5 || true
          systemctl is-system-running || true
      - name: run0 as the runner user
        continue-on-error: true
        run: |
          run0 --no-ask-password id -u; echo "rc=$?"
      - name: run0 after installing polkit and a rule
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq polkitd pkexec
          sudo mkdir -p /etc/polkit-1/rules.d
          sudo tee /etc/polkit-1/rules.d/49-runner.rules >/dev/null <<'RULE'
          polkit.addRule(function(action, subject) {
            if (subject.user == "runner") { return polkit.Result.YES; }
          });
          RULE
          sudo systemctl restart polkit || true
          run0 --no-ask-password id -u; echo "run0 rc=$?"
          pkexec id -u; echo "pkexec rc=$?"
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Elevation tests as they stand, with run0
        continue-on-error: true
        env:
          COSCA_TEST_ELEVATION: "1"
          COSCA_TEST_ELEVATION_RUN0: "1"
          COSCA_TEST_ELEVATION_PASSWORD: "x"
        run: cargo nextest run --locked --features tokio --test elevation --no-fail-fast --no-capture
  win2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: pwsh
        run: cargo build --locked --features tokio --tests --bins --target ${{ matrix.target }}
      - name: Run the elevation tests as a throwaway administrator (medium integrity)
        shell: pwsh
        continue-on-error: true
        run: |
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 24 | ForEach-Object {[char]$_}) + "aA1!"
          net user coscaelev $pw /add
          net localgroup Administrators coscaelev /add
          New-Item -ItemType Directory C:\elevmarker | Out-Null
          icacls C:\elevmarker /inheritance:r /grant "BUILTIN\Administrators:(OI)(CI)F" "NT AUTHORITY\SYSTEM:(OI)(CI)F" | Out-Null
          icacls C:\elevmarker
          $exe = (Get-ChildItem target\${{ matrix.target }}\debug\deps\elevation-*.exe | Where-Object { $_.Name -notmatch 'pkexec' } | Select-Object -First 1).FullName
          "test exe: $exe"
          $cmd = "whoami /groups | findstr /i `"Label Administrators`" > C:\elevmarker\..\elev-who.txt 2>&1 & set COSCA_TEST_ELEVATION=1& set COSCA_TEST_ELEVATION_MARKER_DIR=C:\elevmarker& `"$exe`" --nocapture > C:\elev-out.txt 2>&1"
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\coscaelev", (ConvertTo-SecureString $pw -AsPlainText -Force))
          icacls C:\ /grant "coscaelev:(CI)(OI)M" | Out-Null
          $p = Start-Process cmd.exe -ArgumentList '/c', $cmd -Credential $cred -WorkingDirectory $PWD.Path -Wait -PassThru
          "child exit: $($p.ExitCode)"
          Get-Content C:\elev-who.txt
          Get-Content C:\elev-out.txt
  run0kill:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Does killing the run0 client end the unit?
        continue-on-error: true
        run: |
          set -x
          systemctl --version | head -1
          for mode in --pipe --pty "--pipe --collect" "--pipe --property=KillMode=control-group" ; do
            echo "=== run0 $mode"
            ( setsid run0 --no-ask-password $mode /usr/bin/sleep 600 </dev/null >/dev/null 2>&1 & echo $! > /tmp/client.pid )
            sleep 3
            systemctl list-units --all 'run-u*.service' --no-legend || true
            kill -9 "$(cat /tmp/client.pid)" || true
            sleep 5
            echo "--- after SIGKILL of the client"
            systemctl list-units --all 'run-u*.service' --no-legend || true
            pgrep -a sleep || true
            sudo pkill -f '/usr/bin/sleep 600' || true
            sleep 1
          done
