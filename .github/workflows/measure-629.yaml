# Throwaway: #629 measurements. Not for merging.
name: measure-629

on:
  pull_request:

permissions:
  contents: read

env:
  COSCA_TEST_PATH_PROBES: "0"
  COSCA_TEST_SHELL_EXECUTE: "0"
  COSCA_TEST_SHELL_PROBES: "0"
  COSCA_TEST_ELEVATION_ROUTES: "0"
  NEXTEST_VERSION: "0.9.148"

jobs:
  leads:
    name: Lead ${{ matrix.scenario }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        scenario:
          - startprocess-elevate-m1
          - cpwl-profile-elevate-m1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Allow unattended GUI elevation
        shell: pwsh
        run: python .github/scripts/unattended-gui-elevation.py --this-machine-is-disposable
      - name: Measure
        shell: pwsh
        run: ./.github/measure/profile-hive-629.ps1 ${{ matrix.scenario }}
      - name: Revert unattended GUI elevation
        if: always()
        shell: pwsh
        run: python .github/scripts/unattended-gui-elevation.py --this-machine-is-disposable --revert
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lead-${{ matrix.scenario }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/629
