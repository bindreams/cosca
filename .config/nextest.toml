nextest-version = { required = "0.9.137" }

# A failure bound for every "must panic, not hang" death-watch regression test (the shared
# `accept_or_die`/`accept_or_die_async` primitives in tests/process.rs and tests/tokio_io.rs, and
# the per-helper "reverted to a plain accept" tests in the same two files plus
# tests/windows_breakaway.rs): each asserts that a dead-before-connecting target panics rather
# than hanging the caller. A mutant that broke that guarantee back into a hang would otherwise
# wedge the whole run instead of just failing this one test — this bound turns that into a fast,
# attributable failure. `[profile.default.overrides]` alone is enough: nextest applies it to
# every profile, `ci` included, so a duplicate `[profile.ci.overrides]` entry for the same filter
# would just be dead weight.
[[profile.default.overrides]]
filter = 'test(/panics_loudly_when_the_target_dies_first|panics_if_its_death_watch_is_ever_reverted_to_a_plain_accept/)'
slow-timeout = { period = "10s", terminate-after = 1 }

[profile.ci]
fail-fast = false

[[profile.ci.overrides]]
# `windows_shell_resolution.rs` already bounds its own external waits in-process: every
# `ShellExecuteExW` call likely to hang is wrapped in `shell_execute_bounded`/`SHELL_EXECUTE_BOUND`
# (60s), at most one such call per test. This override is a second, redundant safety net on top of
# that in-process bound, for whatever it cannot cover: a wait this test binary cannot cancel (Win32
# gives no way to cancel a call already inside `ShellExecuteExW`), or a kill that itself does not
# land.
#
# This binary's worst per-test case IS the single-wait bound, unlike `windows_elevation_routes`
# below: no test here makes more than one `SHELL_EXECUTE_BOUND`-wrapped call. 180s (3 * 60s) leaves
# headroom over that 60s floor for the overhead around it (planting a batch file, copying a payload
# binary, reading a marker back) without leaving so much that a genuine hang sits unreported for
# multiple minutes.
filter = 'binary(windows_shell_resolution)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
# `windows_elevation_routes.rs`'s `wait_for` bounds a spawned child's exit with
# `CHILD_EXIT_BOUND_MS`/`GRANDCHILD_EXIT_BOUND_MS` (120s). This override is a second, redundant
# safety net on top of that in-process bound, for whatever it cannot cover — same reasoning as
# `windows_shell_resolution` above.
#
# The per-test worst case, not the single-wait bound, is what this has to clear:
# `does_create_process_with_logon_elevate` calls `logon_one_account` once per scratch account (an
# administrator, then a standard user), and each call makes its own `CHILD_EXIT_BOUND_MS` (120s)
# `wait_for` call in sequence — two 120s waits back to back, 240s, before any of the account-creation
# and token-query overhead around them (`net user`, `icacls`, `LogonUser`/`CreateProcessWithLogonW`,
# `describe`'s token queries) is even counted. 300s (5 * 60s) left only 60s of headroom over that
# 240s floor for overhead this code does not bound, so it is raised here to 600s (10 * 60s) — the
# same roughly 2.5x margin the original 300s kept over a single 120s wait, applied to the 240s floor
# instead of the 120s one. One hang here fails one test instead of the whole job.
filter = 'binary(windows_elevation_routes)'
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups]
# `tests/windows_shell_execute.rs` serializes its tests with an in-process mutex, a holdover from
# when `cargo test` ran them all in one shared process — there PATH and one env var were also
# process-global state the mutex had to guard. Under nextest's one-process-per-test model, PATH
# and that env var are already isolated per test; only the registry keys (App Paths, in HKLM and
# HKCU) are genuinely machine-wide, and the in-process mutex cannot reach across processes to
# guard them. This group caps concurrency for that binary at one test at a time instead.
windows-shell-execute = { max-threads = 1 }

# `does_create_process_with_logon_elevate` and `which_logon_types_return_a_filtered_token` in
# `tests/windows_elevation_routes.rs` both create their scratch accounts under the same two fixed
# names (`coscaprobeadm`, `coscaprobestd`), so nextest's default one-process-per-test parallelism
# would race the two `net user ... /add` calls against each other. This group caps concurrency for
# that binary at one test at a time instead.
windows-elevation-routes = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(windows_shell_execute)'
test-group = 'windows-shell-execute'

[[profile.default.overrides]]
filter = 'binary(windows_elevation_routes)'
test-group = 'windows-elevation-routes'

[[profile.default.overrides]]
# `windows_async_treewalk_grants_no_grace_window_once_the_backend_has_reaped`
# (`src/tokio/child/graceful_tests.rs`) — backstops the test's own proof (see its doc for the
# two checks and what each catches). With correct code, and with either mutant these checks
# catch, the test resolves in well under a second either way, so this bound is pure headroom.
# Under `profile.default` so `profile.ci` and local runs both inherit it — same reasoning as
# `test_support_tests` below.
filter = 'binary(cosca) & test(=tokio::child::graceful::graceful_tests::windows_async_treewalk_grants_no_grace_window_once_the_backend_has_reaped)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Bounds a hang (blocking reap of a `pause()` child) if the guard stops killing, so it fails
# instead. Under `profile.default` so `profile.ci` and local runs both inherit it.
filter = 'test(test_support_tests)'
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# `cgroup_wait_drained_tracks_two_real_members_through_exit`'s unbounded park is made
# deterministic by a real rendezvous (kill the last member only once `drain_step`'s own
# `drain_blocking` seam confirms it armed a listener): a missed wake would otherwise block
# forever. Bounds that hang so it fails instead of stalling the whole job. Under
# `profile.default` so `profile.ci` and local runs both inherit it, same as `test_support_tests`
# above.
filter = 'test(cgroup_wait_drained_tracks_two_real_members_through_exit)'
slow-timeout = { period = "15s", terminate-after = 1 }

[[profile.default.overrides]]
# A backstop, not the proof: `async_wait_never_drains_past_the_low_water_clamp` asserts in-process
# that the armed kqueue is already readable (which catches an `EV_DISABLE` arm) and then awaits
# its `declined_hook` in a `select!`. What nothing in-process catches is the kqueue being readable
# while the watch loop never reaches the `Declined` arm: an event misclassified as `Spurious`, a
# dropped `notify`, or a lost wakeup leaves both `select!` arms pending forever. This turns that
# hang into a bounded per-test failure instead of the darwin job's 15-minute CI timeout. Under
# `default` so a local run is bounded the same way.
filter = 'test(async_wait_never_drains_past_the_low_water_clamp)'
slow-timeout = { period = "20s", terminate-after = 3 }

[[profile.default.overrides]]
# A hang backstop, not a synchronization primitive: fixtures in the `cosca` lib tests block on
# stdin until a real kill, so a regression that skips the kill hangs instead of passing. Tests
# detect that themselves; this bound only stops a hang from stalling the job. It covers the whole
# lib test binary (the one that holds those fixtures), not a list of tests, so a new fixture user is
# bounded without touching this file. The slowest legitimate test is the batch-gate oracle, ~30s
# under load, so 60s x 5 leaves ample headroom. Earlier overrides in this file win for the tests
# they name.
filter = 'binary(cosca)'
slow-timeout = { period = "60s", terminate-after = 5 }
