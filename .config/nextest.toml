nextest-version = { required = "0.9.151" }

[profile.default]
# The one hang backstop for every test in every binary: a hang never ends, so any finite bound
# catches it. It is long because a test's start-up counts toward it, and under load that start-up
# is slow before the test body runs (skuld's per-process coordination, measured past 40 s at 3x
# oversubscription), so a short bound fails healthy tests. An override below exists only to give a
# test more time than this, or to set something other than a bound.
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "1s" }

# The Windows elevation kill tests spawn through UAC and then wait for the payload's socket to end, with their own 20 s
# failure bound (`assert_kill_matches_payload`), so that a false kill is a diagnostic panic. This bound counts from
# the test's start, spawn included, and is the backstop for a hang the in-test bound does not cover; it is longer
# than that bound, or a false kill would show as a timeout instead.
[[profile.default.overrides]]
filter = 'test(/kill_of_an_elevated_child_reports_what_happened/)'
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "1s" }

[profile.ci]
fail-fast = false
# Failure bound, not a sync: a descendant that never closes the test's stdout/stderr fails the test.
# A correct test's pipes close promptly, so any period catches a real leak; this one is far above
# the noise of a loaded runner.
leak-timeout = { period = "5s", result = "fail" }

# The single-backend measurements (`m<n>_…`) only record, as printed `M<n> …` lines, so CI shows
# their output when they pass too.
[[profile.ci.overrides]]
filter = 'test(/(^|::)m[0-9]+_/)'
success-output = "immediate"

# Every nextest step in ci.yaml uploads this file as an artifact (the `upload-junit` action).
[profile.ci.junit]
path = "junit.xml"

# One profile per Unix step in ci.yaml (`.github/scripts/run-nextest.py` selects it through
# `NEXTEST_PROFILE`), so a straggler from one step can only ever write that step's own JUnit file.
# Settings and `[[...overrides]]` are inherited (nextest 0.9.146). Windows runs its steps under the
# shared `ci` profile (run-nextest.ps1), the canaries and the elevation step under profiles of their own.
[profile.ci-tests]
inherits = "ci"

[profile.ci-pty]
inherits = "ci"

[profile.ci-tokio]
inherits = "ci"

[profile.ci-serde]
inherits = "ci"

[profile.ci-path]
inherits = "ci"

[profile.ci-release]
inherits = "ci"

[profile.ci-release-tokio]
inherits = "ci"

[profile.ci-tracer]
inherits = "ci"

[profile.ci-tracer-release]
inherits = "ci"

[profile.ci-cgroup]
inherits = "ci"

[profile.ci-cgroup-setuid]
inherits = "ci"

[profile.ci-elevation]
inherits = "ci"

# `.github/scripts/check-junit.py` fails a lane with a skipped test, but nextest leaves ignored tests out of the
# JUnit file unless asked.
[profile.ci-elevation.junit]
report-skipped = "ignored"

# M10 is a measurement: its output, the elevated child's cwd and environment, is the record, so it is printed on
# success too.
[[profile.ci-elevation.overrides]]
filter = 'test(=m10_the_consent_route_child_runs_in_lp_directory)'
success-output = "final"

[profile.ci-setuid]
inherits = "ci"

[profile.ci-setuid-root]
inherits = "ci"

[profile.ci-root]
inherits = "ci"

# The Windows canaries of the test job (`windows_path_resolution`, `windows_shell_execute`), each under a profile of its
# own so each publishes its own JUnit file.
[profile.ci-canary]
inherits = "ci"

[profile.ci-shell-execute]
inherits = "ci"

[[profile.ci.overrides]]
# `windows_shell_resolution.rs` already bounds its own external waits in-process: every
# `ShellExecuteExW` call likely to hang is wrapped in `shell_execute_bounded`/`SHELL_EXECUTE_BOUND`
# (60s), at most one such call per test. This override is a second, redundant safety net on top of
# that in-process bound, for whatever it cannot cover: a wait this test binary cannot cancel (Win32
# gives no way to cancel a call already inside `ShellExecuteExW`), or a kill that itself does not
# land.
#
# This binary's worst per-test case IS the single-wait bound, unlike `windows_elevation_routes`
# below: no test here makes more than one `SHELL_EXECUTE_BOUND`-wrapped call. 180s (3 * 60s) leaves
# headroom over that 60s floor for the overhead around it (planting a batch file, copying a payload
# binary, reading a marker back) without leaving so much that a genuine hang sits unreported for
# multiple minutes.
filter = 'binary(windows_shell_resolution)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
# `windows_elevation_routes.rs`'s `wait_for` bounds a spawned child's exit with
# `CHILD_EXIT_BOUND_MS`/`GRANDCHILD_EXIT_BOUND_MS` (120s). This override is a second, redundant
# safety net on top of that in-process bound, for whatever it cannot cover — same reasoning as
# `windows_shell_resolution` above.
#
# The per-test worst case, not the single-wait bound, is what this has to clear:
# `does_create_process_with_logon_elevate` calls `logon_one_account` once per scratch account (an
# administrator, then a standard user), and each call makes its own `CHILD_EXIT_BOUND_MS` (120s)
# `wait_for` call in sequence — two 120s waits back to back, 240s, before any of the account-creation
# and token-query overhead around them (`net user`, `icacls`, `LogonUser`/`CreateProcessWithLogonW`,
# `describe`'s token queries) is even counted. 300s (5 * 60s) left only 60s of headroom over that
# 240s floor for overhead this code does not bound, so it is raised here to 600s (10 * 60s) — the
# same roughly 2.5x margin the original 300s kept over a single 120s wait, applied to the 240s floor
# instead of the 120s one. One hang here fails one test instead of the whole job.
filter = 'binary(windows_elevation_routes)'
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups]
# `tests/windows_shell_execute.rs` shares machine-wide registry keys (App Paths, in HKLM and HKCU)
# between its tests, so this group runs that binary one test at a time.
windows-shell-execute = { max-threads = 1 }

# `does_create_process_with_logon_elevate` and `which_logon_types_return_a_filtered_token` in
# `tests/windows_elevation_routes.rs` both create their scratch accounts under the same two fixed
# names (`coscaprobeadm`, `coscaprobestd`), so nextest's default one-process-per-test parallelism
# would race the two `net user ... /add` calls against each other. This group caps concurrency for
# that binary at one test at a time instead.
windows-elevation-routes = { max-threads = 1 }

# The `DRIVE_MAPPING` tests in `tests/windows_process_cwd.rs` each map a drive letter for the whole
# logon session, so two at once would contend for the same letters and see each other's mappings.
# This group runs that whole binary one test at a time, so a new drive-mapping test is covered
# without a filter naming it.
windows-drive-mapping = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(windows_shell_execute)'
test-group = 'windows-shell-execute'

[[profile.default.overrides]]
filter = 'binary(windows_elevation_routes)'
test-group = 'windows-elevation-routes'

[[profile.default.overrides]]
filter = 'binary(windows_process_cwd)'
test-group = 'windows-drive-mapping'
