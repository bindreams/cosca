nextest-version = { required = "0.9.137" }

[profile.ci]
fail-fast = false

[test-groups]
# `tests/windows_shell_execute.rs` serializes its tests with an in-process mutex because they
# share machine-wide state (registry keys, PATH, one env var). That mutex only serializes threads
# of one process, but nextest runs each test in its own process by default, so it does nothing
# across processes. This group caps concurrency for that binary at one test at a time instead.
windows-shell-execute = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(windows_shell_execute)'
test-group = 'windows-shell-execute'
